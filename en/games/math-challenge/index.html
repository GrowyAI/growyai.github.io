<!DOCTYPE html>

<style>

<body>

<div id="gameContainer">
  <canvas id="gameCanvas"></canvas>

  <div id="topBar">
    <button id="uiModeBtn" type="button">Select Mode</button>
    <div id="statsRow">
      <span id="uiScore">Score: 0</span>
      <span id="uiTarget">Goal: 50</span>
      <span id="uiTime">Time: 30</span>
    </div>
  </div>

  <div id="startModal" class="modal">
    <div class="panel">
      <h1>🐱 Hungry Cat</h1>
      <p>Drag the cat to eat the fish with the right answer!<br>Correct = +10 pts, Wrong = -10 pts.<br>Reach 50 pts to win!</p>
      <button id="startBtn">Play</button>
    </div>
  </div>

  <div id="modeSelectModal" class="modal hidden">
    <div class="panel">
      <h1>Select Mode</h1>
      <p>Choose a game mode</p>
      <div id="modeList" class="optionList"></div>
    </div>
  </div>

  <div id="levelSelectModal" class="modal hidden">
    <div class="panel">
      <h1 id="levelSelectTitle">Select Level</h1>
      <p>Choose a level to start</p>
      <div id="levelList" class="optionList"></div>
      <button id="backToModeBtn" class="secondaryBtn">Back</button>
    </div>
  </div>

  <div id="endModal" class="modal hidden">
    <div class="panel">
      <h1 id="endTitle">Game Over</h1>
      <p id="endDesc">Try again!</p>
      <div class="endBtnRow">
        <button id="nextLevelBtn" class="hidden">Next Level</button>
        <button id="restartBtn">Retry</button>
        <button id="chooseOtherBtn" class="secondaryBtn">Menu</button>
      </div>
    </div>
  </div>

  <div id="successToast" class="hidden">
    You Win! 🎉
    <span id="successScoreText" class="toastScore"></span>
  </div>
</div>

<script>
"use strict";

/* ========================= Config ========================= */
const GameConfig = {
  timeLimit: 30,          // seconds
  targetScore: 50,
  maxFish: 8,
  catNumberRange: [5, 10],
  catRadius: 34,
  fishBaseRadius: 20,
  fishRadiusMin: 16,
  fishRadiusMax: 30,
  fishSpeedRange: [25, 55],   // px / second
  fishSpawnMargin: 40,
  fishDespawnMargin: 60,
  grabRadius: 80,
  scoreCorrect: 10,
  scoreWrong: -10,
  successHoldTime: 1000,      // ms
  catNumberFontSize: 18,
  fishNumberFontSize: 16,
  multiplicationFishCount: 4,
  multiplicationMaxB: 9
};

/* ========================= Utils ========================= */
const Utils = {
  randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  },
  randFloat(min, max) {
    return Math.random() * (max - min) + min;
  },
  choice(arr) {
    return arr[Utils.randInt(0, arr.length - 1)];
  },
  dist(x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    return Math.sqrt(dx * dx + dy * dy);
  },
  clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
  },
  randomSign() {
    return Math.random() < 0.5 ? -1 : 1;
  },
  shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Utils.randInt(0, i);
      const tmp = arr[i];
      arr[i] = arr[j];
      arr[j] = tmp;
    }
    return arr;
  },
  easeOutCubic(t) {
    return 1 - Math.pow(1 - t, 3);
  },
  easeOutBack(t) {
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  },
  compareValueGenerator(relation, reference, min, max) {
    if (relation === 'le') {
      const hi = Utils.clamp(reference, min, max);
      return Utils.randInt(min, hi);
    } else {
      const lo = Utils.clamp(reference + 1, min, max);
      if (lo > max) return max;
      return Utils.randInt(lo, max);
    }
  }
};

/* ========================= Levels & Modes ========================= */

function makeRangeLevel(id, name, min, max, catRange) {
  return {
    id: id,
    name: name,
    valueRange: [min, max],
    generateCatNumber: () => Utils.randInt(catRange[0], catRange[1]),
    generate: (catNumber, wantCorrect) => {
      const relation = wantCorrect ? 'le' : 'gt';
      const value = Utils.compareValueGenerator(relation, catNumber, min, max);
      return { display: String(value), answer: value };
    }
  };
}

function makeAdditionLevel(id, name, max, catRange, avoidZero) {
  const minOperand = avoidZero ? 1 : 0;
  return {
    id: id,
    name: name,
    valueRange: [0, max],
    generateCatNumber: () => Utils.randInt(catRange[0], catRange[1]),
    generate: (catNumber, wantCorrect) => {
      let sum;
      if (wantCorrect) {
        sum = catNumber;
      } else {
        const lo = avoidZero ? 2 : 0;
        sum = Utils.randInt(lo, max);
        if (sum === catNumber) {
          sum = (sum + 1 <= max) ? sum + 1 : Math.max(lo, sum - 1);
        }
      }
      const loA = minOperand;
      const hiA = sum - minOperand;
      const a = (hiA >= loA) ? Utils.randInt(loA, hiA) : minOperand;
      const b = sum - a;
      return { display: a + '+' + b, answer: sum };
    }
  };
}

function makeSubtractionLevel(id, name, max, catRange, avoidZero) {
  const minOperand = avoidZero ? 1 : 0;
  return {
    id: id,
    name: name,
    valueRange: [0, max],
    generateCatNumber: () => Utils.randInt(catRange[0], catRange[1]),
    generate: (catNumber, wantCorrect) => {
      let diff;
      if (wantCorrect) {
        diff = catNumber;
      } else {
        const hi = avoidZero ? (max - 1) : max;
        diff = Utils.randInt(0, hi);
        if (diff === catNumber) {
          diff = (diff + 1 <= hi) ? diff + 1 : Math.max(0, diff - 1);
        }
      }
      const loA = diff + minOperand;
      const hiA = max;
      const a = (hiA >= loA) ? Utils.randInt(loA, hiA) : Math.min(max, loA);
      const b = a - diff;
      return { display: a + '-' + b, answer: diff };
    }
  };
}

function makeMultiplicationLevel(base) {
  return {
    id: 'base' + base,
    name: '× ' + base,
    kind: 'multiplication',
    base: base,
    valueRange: [0, base * GameConfig.multiplicationMaxB],
    generateCatNumber: () => base * 1,
    buildRoundSequence: () => {
      const seq = [];
      for (let i = 1; i <= GameConfig.multiplicationMaxB; i++) seq.push(i);
      return seq;
    }
  };
}

function makeDivisionLevel(divisor) {
  return {
    id: 'divisor' + divisor,
    name: '÷ ' + divisor,
    kind: 'division',
    divisor: divisor,
    valueRange: [1, 9],
    generateCatNumber: () => divisor * 1,
    buildRoundSequence: () => {
      const firstHalf = Utils.shuffle([1, 2, 3, 4, 5]);
      const secondHalf = Utils.shuffle([6, 7, 8, 9]);
      return firstHalf.concat(secondHalf);
    }
  };
}

const squareNumberLevel = {
  id: 'squareNumber',
  name: 'Squares',
  valueRange: [1, 625],
  generateCatNumber: () => {
    const base = Utils.randInt(5, 15);
    return base * base;
  },
  generate: (catNumber, wantCorrect) => {
    const relation = wantCorrect ? 'le' : 'gt';
    const BASE_MIN = 1, BASE_MAX = 25;
    const sqrtOfCat = Math.sqrt(Math.max(catNumber, 0));
    let base;
    if (relation === 'le') {
      const hiBase = Utils.clamp(Math.floor(sqrtOfCat), BASE_MIN, BASE_MAX);
      base = Utils.randInt(BASE_MIN, hiBase);
    } else {
      const loBase = Utils.clamp(Math.floor(sqrtOfCat) + 1, BASE_MIN, BASE_MAX);
      base = loBase > BASE_MAX ? BASE_MAX : Utils.randInt(loBase, BASE_MAX);
    }
    return { display: base + '²', answer: base * base };
  }
};

const squareRootLevel = {
  id: 'squareRoot',
  name: 'Square Roots',
  valueRange: [1, 25],
  generateCatNumber: () => Utils.randInt(5, 15),
  generate: (catNumber, wantCorrect) => {
    const relation = wantCorrect ? 'le' : 'gt';
    const n = Utils.compareValueGenerator(relation, catNumber, 1, 25);
    return { display: '√' + (n * n), answer: n };
  }
};

const GAME_MODES = [
  {
    id: 'compareNumber',
    name: 'Compare',
    icon: '🐱',
    levels: [
      makeRangeLevel('within10', 'Up to 10', 0, 10, [3, 8]),
      makeRangeLevel('within20', 'Up to 20', 0, 20, [5, 15]),
      makeRangeLevel('within50', 'Up to 50', 0, 50, [15, 40]),
      makeRangeLevel('within100', 'Up to 100', 0, 100, [30, 80]),
      makeRangeLevel('within1000', 'Up to 1000', 0, 1000, [300, 800]),
      makeRangeLevel('negative', 'Negative Numbers', -99, -1, [-60, -10]),
      squareNumberLevel,
      squareRootLevel
    ]
  },
  {
    id: 'addition',
    name: 'Addition',
    icon: '➕',
    levels: [
      makeAdditionLevel('within5', 'Up to 5', 5, [2, 5], true),
      makeAdditionLevel('within10', 'Up to 10', 10, [3, 10], true),
      makeAdditionLevel('within20', 'Up to 20', 20, [6, 20], false),
      makeAdditionLevel('within30', 'Up to 30', 30, [12, 30], false),
      makeAdditionLevel('within50', 'Up to 50', 50, [18, 50], false),
      makeAdditionLevel('within100', 'Up to 100', 100, [30, 100], false)
    ]
  },
  {
    id: 'subtraction',
    name: 'Subtraction',
    icon: '➖',
    levels: [
      makeSubtractionLevel('within5', 'Up to 5', 5, [2, 4], true),
      makeSubtractionLevel('within10', 'Up to 10', 10, [3, 9], true),
      makeSubtractionLevel('within20', 'Up to 20', 20, [6, 20], false),
      makeSubtractionLevel('within30', 'Up to 30', 30, [12, 30], false),
      makeSubtractionLevel('within50', 'Up to 50', 50, [18, 50], false),
      makeSubtractionLevel('within100', 'Up to 100', 100, [30, 100], false)
    ]
  },
  {
    id: 'multiplication',
    name: 'Multiplication',
    icon: '✖️',
    levels: [
      makeMultiplicationLevel(1),
      makeMultiplicationLevel(2),
      makeMultiplicationLevel(3),
      makeMultiplicationLevel(4),
      makeMultiplicationLevel(5),
      makeMultiplicationLevel(6),
      makeMultiplicationLevel(7),
      makeMultiplicationLevel(8),
      makeMultiplicationLevel(9)
    ]
  },
  {
    id: 'division',
    name: 'Division',
    icon: '➗',
    levels: [
      makeDivisionLevel(1),
      makeDivisionLevel(2),
      makeDivisionLevel(3),
      makeDivisionLevel(4),
      makeDivisionLevel(5),
      makeDivisionLevel(6),
      makeDivisionLevel(7),
      makeDivisionLevel(8),
      makeDivisionLevel(9)
    ]
  }
];

const LEVEL_SEQUENCE = [];
for (const mode of GAME_MODES) {
  for (const level of mode.levels) {
    LEVEL_SEQUENCE.push({ mode, level });
  }
}

function getNextLevelStep(mode, level) {
  const idx = LEVEL_SEQUENCE.findIndex(
    step => step.mode.id === mode.id && step.level.id === level.id
  );
  if (idx === -1 || idx === LEVEL_SEQUENCE.length - 1) return null;
  return LEVEL_SEQUENCE[idx + 1];
}

/* ========================= QuestionGenerator ========================= */
class QuestionGenerator {
  generate(level, context) {
    if (!level || typeof level.generate !== 'function') {
      throw new Error('Invalid level config: missing generate()');
    }
    return level.generate(context.reference, context.wantCorrect);
  }
}

/* ========================= GameState ========================= */
class GameState {
  constructor(config) {
    this.config = config;
    this.reset(null);
  }

  reset(level) {
    this.status = 'idle'; // idle | playing | success | fail
    this.score = 0;
    this.timeRemaining = this.config.timeLimit;
    this.kind = (level && level.kind) || 'standard';
    if (level && typeof level.buildRoundSequence === 'function') {
      this.roundSequence = level.buildRoundSequence();
      this.roundIndex = 0;
      this.roundMax = this.roundSequence.length;
    } else {
      this.roundSequence = null;
      this.roundIndex = 0;
      this.roundMax = 0;
    }
    const catNumber = level
      ? level.generateCatNumber()
      : Utils.randInt(this.config.catNumberRange[0], this.config.catNumberRange[1]);
    this.cat = {
      x: 0,
      y: 0,
      radius: this.config.catRadius,
      number: catNumber,
      display: null,
      squash: 1,
      squashTarget: 1,
      bobPhase: Math.random() * Math.PI * 2,
      blinkTimer: Utils.randFloat(2, 5),
      tailPhase: Math.random() * Math.PI * 2
    };
  }

  addScore(delta) {
    this.score = Math.max(0, this.score + delta);
  }
}

/* ========================= FishManager ========================= */
class FishManager {
  constructor(config, questionGenerator) {
    this.config = config;
    this.questionGenerator = questionGenerator;
    this.fishList = [];
    this.spawnCounter = 0;
    this.palettes = [
      { body: '#4FC3F7', bodyDark: '#0288D1', belly: '#B3E5FC' },
      { body: '#FF8A65', bodyDark: '#E64A19', belly: '#FFCCBC' },
      { body: '#BA68C8', bodyDark: '#7B1FA2', belly: '#E1BEE7' },
      { body: '#4DD0E1', bodyDark: '#00838F', belly: '#B2EBF2' },
      { body: '#FFD54F', bodyDark: '#F57F17', belly: '#FFF9C4' }
    ];
  }

  reset() {
    this.fishList = [];
    this.spawnCounter = 0;
  }

  _pickEdgeSpawn(radius, bounds) {
    const margin = this.config.fishSpawnMargin + radius;
    const edge = Utils.randInt(0, 3);
    const coneSpread = Math.PI / 3.2;
    let x, y, baseAngle;

    if (edge === 0) {
      x = Utils.randFloat(radius, Math.max(radius, bounds.width - radius));
      y = -margin;
      baseAngle = Math.PI / 2;
    } else if (edge === 1) {
      x = bounds.width + margin;
      y = Utils.randFloat(radius + 60, Math.max(radius + 60, bounds.height - radius));
      baseAngle = Math.PI;
    } else if (edge === 2) {
      x = Utils.randFloat(radius, Math.max(radius, bounds.width - radius));
      y = bounds.height + margin;
      baseAngle = -Math.PI / 2;
    } else {
      x = -margin;
      y = Utils.randFloat(radius + 60, Math.max(radius + 60, bounds.height - radius));
      baseAngle = 0;
    }

    const angle = baseAngle + Utils.randFloat(-coneSpread, coneSpread);
    return { x, y, angle };
  }

  spawnOne(level, catNumber, bounds, wantCorrect) {
    const question = this.questionGenerator.generate(
      level,
      { reference: catNumber, wantCorrect: wantCorrect }
    );

    const value = question.answer;
    const [vmin, vmax] = level.valueRange || [0, catNumber + 10];
    const t = Utils.clamp((value - vmin) / ((vmax - vmin) || 1), 0, 1);
    const radius = this.config.fishRadiusMin +
      t * (this.config.fishRadiusMax - this.config.fishRadiusMin);

    const speed = Utils.randFloat(this.config.fishSpeedRange[0], this.config.fishSpeedRange[1]);
    const spawnPos = this._pickEdgeSpawn(radius, bounds);
    const palette = Utils.choice(this.palettes);

    const fish = {
      x: spawnPos.x,
      y: spawnPos.y,
      vx: Math.cos(spawnPos.angle) * speed,
      vy: Math.sin(spawnPos.angle) * speed,
      radius: radius,
      display: question.display,
      answer: question.answer,
      isCorrect: wantCorrect,
      angle: spawnPos.angle,
      palette: palette,
      wigglePhase: Math.random() * Math.PI * 2,
      spawnT: 0
    };
    this.fishList.push(fish);
    this.spawnCounter++;
  }

  fillToMax(level, catNumber, bounds) {
    while (this.fishList.length < this.config.maxFish) {
      let wantCorrect;
      if (level.correctProbability === undefined) {
        wantCorrect = (this.spawnCounter % 2 === 0);
      } else {
        wantCorrect = Math.random() < level.correctProbability;
      }
      this.spawnOne(level, catNumber, bounds, wantCorrect);
    }
  }

  spawnMultiplicationRound(level, base, b, bounds) {
    const correctValue = base * b;
    const candidatePool = [];
    for (let ob = 1; ob <= this.config.multiplicationMaxB; ob++) {
      if (ob !== b) candidatePool.push(base * ob);
    }
    this._spawnAnswerRound(level, correctValue, candidatePool, 8, bounds);
  }

  spawnDivisionRound(level, divisor, quotient, bounds) {
    const correctValue = quotient;
    const candidatePool = [];
    for (let q = 1; q <= 9; q++) {
      if (q !== quotient) candidatePool.push(q);
    }
    this._spawnAnswerRound(level, correctValue, candidatePool, 3, bounds);
  }

  _spawnAnswerRound(level, correctValue, candidatePool, jitterRange, bounds) {
    this.fishList = [];
    const need = this.config.multiplicationFishCount - 1;
    const wrongValues = [];
    const maxTries = 200;
    let tries = 0;
    while (wrongValues.length < need && tries < maxTries) {
      tries++;
      let candidate;
      if (candidatePool.length && Math.random() < 0.6) {
        candidate = Utils.choice(candidatePool);
      } else {
        candidate = correctValue + Utils.randInt(-jitterRange, jitterRange);
      }
      if (candidate <= 0) candidate = correctValue + Utils.randInt(1, jitterRange || 1);
      if (candidate !== correctValue && !wrongValues.includes(candidate)) {
        wrongValues.push(candidate);
      }
    }
    let fallback = correctValue + 1;
    while (wrongValues.length < need) {
      if (fallback !== correctValue && !wrongValues.includes(fallback)) {
        wrongValues.push(fallback);
      }
      fallback++;
    }

    const items = [{ value: correctValue, isCorrect: true }];
    for (const v of wrongValues) items.push({ value: v, isCorrect: false });

    const [vmin, vmax] = level.valueRange || [0, correctValue + 20];
    for (const item of items) {
      const t = Utils.clamp((item.value - vmin) / ((vmax - vmin) || 1), 0, 1);
      const radius = this.config.fishRadiusMin +
        t * (this.config.fishRadiusMax - this.config.fishRadiusMin);
      const speed = Utils.randFloat(this.config.fishSpeedRange[0], this.config.fishSpeedRange[1]);
      const spawnPos = this._pickEdgeSpawn(radius, bounds);
      const palette = Utils.choice(this.palettes);

      this.fishList.push({
        x: spawnPos.x,
        y: spawnPos.y,
        vx: Math.cos(spawnPos.angle) * speed,
        vy: Math.sin(spawnPos.angle) * speed,
        radius: radius,
        display: String(item.value),
        answer: item.value,
        isCorrect: item.isCorrect,
        angle: spawnPos.angle,
        palette: palette,
        wigglePhase: Math.random() * Math.PI * 2,
        spawnT: 0,
        bounce: true,
        enteredX: (spawnPos.x - radius >= 0 && spawnPos.x + radius <= bounds.width),
        enteredY: (spawnPos.y - radius >= 0 && spawnPos.y + radius <= bounds.height)
      });
    }
  }

  update(dt, bounds) {
    const despawnMargin = this.config.fishDespawnMargin;
    for (const fish of this.fishList) {
      fish.x += fish.vx * dt;
      fish.y += fish.vy * dt;

      if (fish.bounce) {
        const r = fish.radius;
        if (!fish.enteredX && fish.x - r >= 0 && fish.x + r <= bounds.width) {
          fish.enteredX = true;
        }
        if (fish.enteredX) {
          if (fish.x - r < 0) {
            fish.x = r;
            fish.vx = Math.abs(fish.vx);
          } else if (fish.x + r > bounds.width) {
            fish.x = bounds.width - r;
            fish.vx = -Math.abs(fish.vx);
          }
        }
        if (!fish.enteredY && fish.y - r >= 0 && fish.y + r <= bounds.height) {
          fish.enteredY = true;
        }
        if (fish.enteredY) {
          if (fish.y - r < 0) {
            fish.y = r;
            fish.vy = Math.abs(fish.vy);
          } else if (fish.y + r > bounds.height) {
            fish.y = bounds.height - r;
            fish.vy = -Math.abs(fish.vy);
          }
        }
        fish.angle = Math.atan2(fish.vy, fish.vx);
      }

      fish.wigglePhase += dt * 6;
      if (fish.spawnT < 1) fish.spawnT = Math.min(1, fish.spawnT + dt * 4);
    }

    this.fishList = this.fishList.filter(fish => {
      if (fish.bounce) return true;
      const m = fish.radius + despawnMargin;
      const outOfBounds =
        fish.x < -m || fish.x > bounds.width + m ||
        fish.y < -m || fish.y > bounds.height + m;
      return !outOfBounds;
    });
  }

  removeFish(fish) {
    const idx = this.fishList.indexOf(fish);
    if (idx !== -1) this.fishList.splice(idx, 1);
  }
}

/* ========================= CollisionManager ========================= */
class CollisionManager {
  constructor(config) {
    this.config = config;
  }

  checkAndResolve(catState, fishManager, onEat, maxEat) {
    const cat = catState.cat;
    const eaten = [];

    for (const fish of fishManager.fishList) {
      const d = Utils.dist(cat.x, cat.y, fish.x, fish.y);
      if (d < cat.radius * 0.75 + fish.radius * 0.6) {
        eaten.push(fish);
        if (typeof maxEat === 'number' && eaten.length >= maxEat) break;
      }
    }

    for (const fish of eaten) {
      const isCorrect = fish.isCorrect;
      const delta = isCorrect ? this.config.scoreCorrect : this.config.scoreWrong;
      catState.addScore(delta);
      fishManager.removeFish(fish);
      cat.squash = isCorrect ? 1.25 : 0.8;
      if (onEat) onEat(fish, isCorrect, delta);
    }
  }
}

/* ========================= EffectsManager ========================= */
class EffectsManager {
  constructor() {
    this.floatingTexts = [];
    this.particles = [];
    this.ripples = [];
  }

  spawnScoreText(x, y, delta) {
    this.floatingTexts.push({
      x, y,
      startY: y,
      text: (delta > 0 ? '+' : '') + delta,
      color: delta > 0 ? '#2ECC71' : '#E74C3C',
      life: 0,
      maxLife: 0.9
    });
  }

  spawnEatBurst(x, y, colorHex, isCorrect) {
    const count = isCorrect ? 10 : 14;
    for (let i = 0; i < count; i++) {
      const angle = Utils.randFloat(0, Math.PI * 2);
      const speed = Utils.randFloat(60, 180);
      this.particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        radius: Utils.randFloat(2, 5),
        color: colorHex,
        life: 0,
        maxLife: Utils.randFloat(0.4, 0.7)
      });
    }
    this.ripples.push({ x, y, life: 0, maxLife: 0.5, isCorrect });
  }

  update(dt) {
    for (const ft of this.floatingTexts) {
      ft.life += dt;
      ft.y = ft.startY - Utils.easeOutCubic(Math.min(1, ft.life / ft.maxLife)) * 46;
    }
    this.floatingTexts = this.floatingTexts.filter(f => f.life < f.maxLife);

    for (const p of this.particles) {
      p.life += dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 220 * dt;
      p.vx *= 0.96;
    }
    this.particles = this.particles.filter(p => p.life < p.maxLife);

    for (const r of this.ripples) {
      r.life += dt;
    }
    this.ripples = this.ripples.filter(r => r.life < r.maxLife);
  }

  render(ctx) {
    for (const r of this.ripples) {
      const t = r.life / r.maxLife;
      const radius = 10 + t * 50;
      ctx.save();
      ctx.globalAlpha = (1 - t) * 0.6;
      ctx.strokeStyle = r.isCorrect ? '#2ECC71' : '#E74C3C';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(r.x, r.y, radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    for (const p of this.particles) {
      const t = p.life / p.maxLife;
      ctx.save();
      ctx.globalAlpha = 1 - t;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius * (1 - t * 0.4), 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    for (const ft of this.floatingTexts) {
      const t = ft.life / ft.maxLife;
      const scale = t < 0.25 ? Utils.easeOutBack(t / 0.25) : 1;
      const alpha = t < 0.7 ? 1 : 1 - (t - 0.7) / 0.3;
      ctx.save();
      ctx.globalAlpha = Utils.clamp(alpha, 0, 1);
      ctx.translate(ft.x, ft.y);
      ctx.scale(scale, scale);
      ctx.font = 'bold 26px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.strokeText(ft.text, 0, 0);
      ctx.fillStyle = ft.color;
      ctx.fillText(ft.text, 0, 0);
      ctx.restore();
    }
  }
}

/* ========================= InputManager ========================= */
class InputManager {
  constructor(canvas, config, getCat) {
    this.canvas = canvas;
    this.config = config;
    this.getCat = getCat;
    this.dragging = false;
    this.activeTouchId = null;

    this._bind();
  }

  _getCanvasPos(touch) {
    const rect = this.canvas.getBoundingClientRect();
    return {
      x: touch.clientX - rect.left,
      y: touch.clientY - rect.top
    };
  }

  _bind() {
    this.canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (this.activeTouchId !== null) return;
      const touch = e.changedTouches[0];
      const pos = this._getCanvasPos(touch);
      const cat = this.getCat();
      if (!cat) return;
      const d = Utils.dist(pos.x, pos.y, cat.x, cat.y);
      if (d <= this.config.grabRadius) {
        this.dragging = true;
        this.activeTouchId = touch.identifier;
      }
    }, { passive: false });

    this.canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (!this.dragging) return;
      for (const touch of e.changedTouches) {
        if (touch.identifier === this.activeTouchId) {
          const pos = this._getCanvasPos(touch);
          const cat = this.getCat();
          if (cat) {
            cat.x = pos.x;
            cat.y = pos.y;
          }
        }
      }
    }, { passive: false });

    const endHandler = (e) => {
      e.preventDefault();
      for (const touch of e.changedTouches) {
        if (touch.identifier === this.activeTouchId) {
          this.dragging = false;
          this.activeTouchId = null;
        }
      }
    };

    this.canvas.addEventListener('touchend', endHandler, { passive: false });
    this.canvas.addEventListener('touchcancel', endHandler, { passive: false });

    document.body.addEventListener('touchmove', (e) => {
      e.preventDefault();
    }, { passive: false });
  }

  clampCatToBounds(cat, bounds) {
    cat.x = Utils.clamp(cat.x, cat.radius, bounds.width - cat.radius);
    cat.y = Utils.clamp(cat.y, 60 + cat.radius, bounds.height - cat.radius);
  }
}

/* ========================= Renderer ========================= */
class Renderer {
  constructor(ctx, config) {
    this.ctx = ctx;
    this.config = config;
    this.time = 0;
    this.bubbles = [];
    for (let i = 0; i < 18; i++) {
      this.bubbles.push({
        x: Math.random(),
        y: Math.random(),
        r: Utils.randFloat(2, 6),
        speed: Utils.randFloat(8, 22),
        drift: Utils.randFloat(-0.3, 0.3)
      });
    }
  }

  clear(width, height, dt) {
    const ctx = this.ctx;
    this.time += dt;

    const grad = ctx.createLinearGradient(0, 0, 0, height);
    grad.addColorStop(0, '#7FD8FF');
    grad.addColorStop(0.5, '#3FA9F5');
    grad.addColorStop(1, '#0B6FB0');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);

    ctx.save();
    ctx.globalAlpha = 0.10;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    for (let i = 0; i < 5; i++) {
      const yOff = ((this.time * 18 + i * 140) % (height + 100)) - 50;
      ctx.beginPath();
      ctx.moveTo(0, yOff);
      for (let x = 0; x <= width; x += 40) {
        ctx.lineTo(x, yOff + Math.sin(x * 0.02 + this.time + i) * 10);
      }
      ctx.stroke();
    }
    ctx.restore();

    ctx.save();
    for (const b of this.bubbles) {
      b.y -= (b.speed * dt) / height;
      if (b.y < -0.02) {
        b.y = 1.02;
        b.x = Math.random();
      }
      const bx = (b.x + Math.sin(this.time * 0.5 + b.x * 10) * b.drift * 0.02) * width;
      const by = b.y * height;
      ctx.globalAlpha = 0.28;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(bx, by, b.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  _drawShadow(x, y, rx, ry) {
    const ctx = this.ctx;
    ctx.save();
    ctx.globalAlpha = 0.18;
    ctx.fillStyle = '#00243D';
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  drawFish(fish) {
    const ctx = this.ctx;
    const spawnScale = Utils.easeOutBack(fish.spawnT);
    const wiggle = Math.sin(fish.wigglePhase) * 0.35;
    const p = fish.palette;

    this._drawShadow(fish.x, fish.y + fish.radius * 0.9, fish.radius * 0.8, fish.radius * 0.25);

    ctx.save();
    ctx.translate(fish.x, fish.y);
    ctx.rotate(fish.angle);
    ctx.scale(spawnScale, spawnScale);

    ctx.save();
    ctx.translate(-fish.radius * 0.95, 0);
    ctx.rotate(wiggle);
    const tailGrad = ctx.createLinearGradient(0, -fish.radius * 0.7, 0, fish.radius * 0.7);
    tailGrad.addColorStop(0, p.body);
    tailGrad.addColorStop(1, p.bodyDark);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(-fish.radius * 0.5, -fish.radius * 0.75, -fish.radius * 0.95, -fish.radius * 0.55);
    ctx.quadraticCurveTo(-fish.radius * 0.55, 0, -fish.radius * 0.95, fish.radius * 0.55);
    ctx.quadraticCurveTo(-fish.radius * 0.5, fish.radius * 0.75, 0, 0);
    ctx.closePath();
    ctx.fillStyle = tailGrad;
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.rotate(wiggle * 0.4);
    ctx.beginPath();
    ctx.moveTo(-fish.radius * 0.05, -fish.radius * 0.55);
    ctx.quadraticCurveTo(fish.radius * 0.15, -fish.radius * 1.05, fish.radius * 0.35, -fish.radius * 0.5);
    ctx.closePath();
    ctx.fillStyle = p.bodyDark;
    ctx.globalAlpha = 0.85;
    ctx.fill();
    ctx.restore();

    const bodyGrad = ctx.createRadialGradient(
      -fish.radius * 0.25, -fish.radius * 0.35, fish.radius * 0.1,
      0, 0, fish.radius * 1.2
    );
    bodyGrad.addColorStop(0, p.belly);
    bodyGrad.addColorStop(0.5, p.body);
    bodyGrad.addColorStop(1, p.bodyDark);
    ctx.beginPath();
    ctx.ellipse(0, 0, fish.radius, fish.radius * 0.68, 0, 0, Math.PI * 2);
    ctx.fillStyle = bodyGrad;
    ctx.fill();
    ctx.strokeStyle = p.bodyDark;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = fish.radius * 0.14;
    ctx.beginPath();
    ctx.ellipse(fish.radius * 0.05, fish.radius * 0.25, fish.radius * 0.55, fish.radius * 0.22, 0, Math.PI * 0.15, Math.PI * 0.85);
    ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.rotate(Math.sin(fish.wigglePhase * 1.3) * 0.25 + 0.3);
    ctx.beginPath();
    ctx.moveTo(-fish.radius * 0.05, fish.radius * 0.3);
    ctx.quadraticCurveTo(-fish.radius * 0.15, fish.radius * 0.75, fish.radius * 0.15, fish.radius * 0.6);
    ctx.closePath();
    ctx.fillStyle = p.bodyDark;
    ctx.globalAlpha = 0.8;
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = p.bodyDark;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(fish.radius * 0.42, fish.radius * 0.05, fish.radius * 0.22, Math.PI * 0.65, Math.PI * 1.35);
    ctx.stroke();
    ctx.restore();

    ctx.beginPath();
    ctx.arc(fish.radius * 0.55, -fish.radius * 0.1, fish.radius * 0.18, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(fish.radius * 0.6, -fish.radius * 0.1, fish.radius * 0.1, 0, Math.PI * 2);
    ctx.fillStyle = '#2C3E50';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(fish.radius * 0.64, -fish.radius * 0.15, fish.radius * 0.035, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();

    ctx.save();
    ctx.strokeStyle = p.bodyDark;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(fish.radius * 0.85, fish.radius * 0.05, fish.radius * 0.18, Math.PI * 0.1, Math.PI * 0.5);
    ctx.stroke();
    ctx.restore();

    ctx.restore();

    ctx.save();
    const ty = fish.y - fish.radius * spawnScale - 14;
    ctx.globalAlpha = spawnScale;
    ctx.font = `bold ${this.config.fishNumberFontSize}px sans-serif`;
    const textW = ctx.measureText(fish.display).width;
    const bubbleRx = Math.max(fish.radius * 0.55 + 6, textW / 2 + 9);
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.ellipse(fish.x, ty, bubbleRx, 12, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = p.bodyDark;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(fish.display, fish.x, ty);
    ctx.restore();
  }

  drawCat(cat) {
    const ctx = this.ctx;
    const bob = Math.sin(cat.bobPhase) * 2;
    const sq = cat.squash;
    const isBlinking = cat.blinkTimer < 0.12;

    this._drawShadow(cat.x, cat.y + cat.radius * 0.95, cat.radius * 0.85, cat.radius * 0.28);

    ctx.save();
    ctx.translate(cat.x, cat.y + bob);
    ctx.scale(1 / Math.sqrt(sq), sq);

    ctx.save();
    ctx.translate(cat.radius * 0.55, cat.radius * 0.55);
    ctx.rotate(Math.sin(cat.tailPhase) * 0.35 + 0.4);
    ctx.strokeStyle = '#FF8C42';
    ctx.lineWidth = cat.radius * 0.22;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(cat.radius * 0.7, cat.radius * 0.1, cat.radius * 0.75, -cat.radius * 0.55);
    ctx.stroke();
    ctx.restore();

    const earGrad = ctx.createLinearGradient(0, -cat.radius * 1.2, 0, -cat.radius * 0.5);
    earGrad.addColorStop(0, '#FFB066');
    earGrad.addColorStop(1, '#FF8C42');

    ctx.fillStyle = earGrad;
    ctx.beginPath();
    ctx.moveTo(-cat.radius * 0.62, -cat.radius * 0.55);
    ctx.lineTo(-cat.radius * 0.18, -cat.radius * 1.22);
    ctx.lineTo(cat.radius * 0.08, -cat.radius * 0.5);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-cat.radius * 0.5, -cat.radius * 0.62);
    ctx.lineTo(-cat.radius * 0.24, -cat.radius * 1.02);
    ctx.lineTo(-cat.radius * 0.08, -cat.radius * 0.56);
    ctx.closePath();
    ctx.fillStyle = '#FFD1B0';
    ctx.fill();

    ctx.fillStyle = earGrad;
    ctx.beginPath();
    ctx.moveTo(cat.radius * 0.62, -cat.radius * 0.55);
    ctx.lineTo(cat.radius * 0.18, -cat.radius * 1.22);
    ctx.lineTo(-cat.radius * 0.08, -cat.radius * 0.5);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cat.radius * 0.5, -cat.radius * 0.62);
    ctx.lineTo(cat.radius * 0.24, -cat.radius * 1.02);
    ctx.lineTo(cat.radius * 0.08, -cat.radius * 0.56);
    ctx.closePath();
    ctx.fillStyle = '#FFD1B0';
    ctx.fill();

    const bodyGrad = ctx.createRadialGradient(
      -cat.radius * 0.3, -cat.radius * 0.4, cat.radius * 0.1,
      0, 0, cat.radius * 1.15
    );
    bodyGrad.addColorStop(0, '#FFD199');
    bodyGrad.addColorStop(0.55, '#FFA652');
    bodyGrad.addColorStop(1, '#F08425');
    ctx.beginPath();
    ctx.arc(0, 0, cat.radius, 0, Math.PI * 2);
    ctx.fillStyle = bodyGrad;
    ctx.fill();
    ctx.strokeStyle = '#E07B27';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = '#E07B27';
    ctx.lineWidth = cat.radius * 0.08;
    ctx.lineCap = 'round';
    for (const dx of [-0.22, 0, 0.22]) {
      ctx.beginPath();
      ctx.moveTo(cat.radius * dx, -cat.radius * 0.9);
      ctx.lineTo(cat.radius * dx * 1.3, -cat.radius * 0.55);
      ctx.stroke();
    }
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = '#FF9E9E';
    ctx.beginPath();
    ctx.ellipse(-cat.radius * 0.55, cat.radius * 0.2, cat.radius * 0.16, cat.radius * 0.1, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cat.radius * 0.55, cat.radius * 0.2, cat.radius * 0.16, cat.radius * 0.1, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 1.4;
    ctx.lineCap = 'round';
    for (const s of [-1, 1]) {
      for (let i = 0; i < 3; i++) {
        const yy = cat.radius * (0.12 + i * 0.1);
        ctx.beginPath();
        ctx.moveTo(s * cat.radius * 0.35, yy);
        ctx.lineTo(s * cat.radius * (0.9 + i * 0.08), yy - cat.radius * 0.05 + i * cat.radius * 0.04);
        ctx.stroke();
      }
    }
    ctx.restore();

    const eyeY = -cat.radius * 0.05;
    for (const s of [-1, 1]) {
      ctx.save();
      ctx.translate(s * cat.radius * 0.33, eyeY);
      if (isBlinking) {
        ctx.strokeStyle = '#3A2416';
        ctx.lineWidth = cat.radius * 0.05;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-cat.radius * 0.1, 0);
        ctx.lineTo(cat.radius * 0.1, 0);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.ellipse(0, 0, cat.radius * 0.11, cat.radius * 0.14, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#3A2416';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(-cat.radius * 0.03, -cat.radius * 0.05, cat.radius * 0.04, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
      }
      ctx.restore();
    }

    ctx.beginPath();
    ctx.moveTo(-cat.radius * 0.04, cat.radius * 0.13);
    ctx.lineTo(cat.radius * 0.04, cat.radius * 0.13);
    ctx.lineTo(0, cat.radius * 0.19);
    ctx.closePath();
    ctx.fillStyle = '#D35400';
    ctx.fill();

    ctx.save();
    ctx.strokeStyle = '#B4552A';
    ctx.lineWidth = 1.6;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, cat.radius * 0.19);
    ctx.quadraticCurveTo(-cat.radius * 0.08, cat.radius * 0.3, -cat.radius * 0.18, cat.radius * 0.22);
    ctx.moveTo(0, cat.radius * 0.19);
    ctx.quadraticCurveTo(cat.radius * 0.08, cat.radius * 0.3, cat.radius * 0.18, cat.radius * 0.22);
    ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = '#FFB066';
    ctx.beginPath();
    ctx.ellipse(-cat.radius * 0.4, cat.radius * 0.88, cat.radius * 0.2, cat.radius * 0.14, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cat.radius * 0.4, cat.radius * 0.88, cat.radius * 0.2, cat.radius * 0.14, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.restore();

    ctx.save();
    const ty = cat.y + bob - cat.radius * sq - 18;
    ctx.font = `bold ${this.config.catNumberFontSize}px sans-serif`;
    const numText = (cat.display !== undefined && cat.display !== null) ? cat.display : String(cat.number);
    const textW = ctx.measureText(numText).width;
    const bubbleRx = Math.max(20, textW / 2 + 10);
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.strokeStyle = '#FF8C42';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(cat.x, ty, bubbleRx, 14, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#E67E22';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(numText, cat.x, ty);
    ctx.restore();
  }

  updateCatAnim(cat, dt) {
    cat.bobPhase += dt * 2;
    cat.tailPhase += dt * 2.2;
    cat.squash += (cat.squashTarget - cat.squash) * Math.min(1, dt * 10);
    if (Math.abs(cat.squash - cat.squashTarget) < 0.01 && cat.squashTarget !== 1) {
      cat.squashTarget = 1;
    }
    cat.blinkTimer -= dt;
    if (cat.blinkTimer < -0.15) {
      cat.blinkTimer = Utils.randFloat(2.5, 5.5);
    }
  }

  render(width, height, dt, fishManager, cat, effects) {
    this.clear(width, height, dt);
    for (const fish of fishManager.fishList) {
      this.drawFish(fish);
    }
    this.updateCatAnim(cat, dt);
    this.drawCat(cat);
    effects.render(this.ctx);
  }
}

/* ========================= UI ========================= */
class UI {
  constructor(config) {
    this.config = config;
    this.elMode = document.getElementById('uiModeBtn');
    this.elScore = document.getElementById('uiScore');
    this.elTarget = document.getElementById('uiTarget');
    this.elTime = document.getElementById('uiTime');

    this.startModal = document.getElementById('startModal');
    this.modeSelectModal = document.getElementById('modeSelectModal');
    this.levelSelectModal = document.getElementById('levelSelectModal');
    this.endModal = document.getElementById('endModal');
    this.endTitle = document.getElementById('endTitle');
    this.endDesc = document.getElementById('endDesc');
    this.successToast = document.getElementById('successToast');
    this.successScoreText = document.getElementById('successScoreText');

    this.modeListEl = document.getElementById('modeList');
    this.levelListEl = document.getElementById('levelList');
    this.levelSelectTitle = document.getElementById('levelSelectTitle');

    this.startBtn = document.getElementById('startBtn');
    this.restartBtn = document.getElementById('restartBtn');
    this.nextLevelBtn = document.getElementById('nextLevelBtn');
    this.backToModeBtn = document.getElementById('backToModeBtn');
    this.chooseOtherBtn = document.getElementById('chooseOtherBtn');

    this.elTarget.textContent = 'Goal: ' + this.config.targetScore;
  }

  updateHUD(state) {
    this.elScore.textContent = 'Score: ' + state.score;
    if (state.kind === 'multiplication' || state.kind === 'division') {
      this.elTime.textContent = 'Progress: ' + (state.roundIndex + 1) + '/' + state.roundMax;
    } else {
      this.elTime.textContent = 'Time: ' + Math.ceil(state.timeRemaining);
    }
  }

  setModeLabel(mode, level) {
    this.elMode.textContent = mode.icon + ' ' + mode.name + ' · ' + level.name;
  }

  showStart() {
    this.startModal.classList.remove('hidden');
    this.modeSelectModal.classList.add('hidden');
    this.levelSelectModal.classList.add('hidden');
    this.endModal.classList.add('hidden');
    this.successToast.classList.add('hidden');
  }

  hideStart() {
    this.startModal.classList.add('hidden');
  }

  renderModeList(modes, onSelect) {
    this.modeListEl.innerHTML = '';
    for (const mode of modes) {
      const btn = document.createElement('button');
      btn.className = 'optionBtn';
      btn.textContent = mode.icon + ' ' + mode.name;
      btn.addEventListener('click', () => onSelect(mode));
      this.modeListEl.appendChild(btn);
    }
  }

  renderLevelList(mode, onSelect) {
    this.levelSelectTitle.textContent = mode.icon + ' ' + mode.name;
    this.levelListEl.innerHTML = '';
    for (const level of mode.levels) {
      const btn = document.createElement('button');
      btn.className = 'optionBtn';
      btn.textContent = level.name;
      btn.addEventListener('click', () => onSelect(level));
      this.levelListEl.appendChild(btn);
    }
  }

  showModeSelect() {
    this.modeSelectModal.classList.remove('hidden');
    this.levelSelectModal.classList.add('hidden');
    this.endModal.classList.add('hidden');
  }

  hideModeSelect() {
    this.modeSelectModal.classList.add('hidden');
  }

  showLevelSelect() {
    this.levelSelectModal.classList.remove('hidden');
    this.modeSelectModal.classList.add('hidden');
  }

  hideLevelSelect() {
    this.levelSelectModal.classList.add('hidden');
  }

  showSuccessToast(score) {
    this.successScoreText.textContent = 'Score: ' + score;
    this.successToast.classList.remove('hidden');
  }

  hideSuccessToast() {
    this.successToast.classList.add('hidden');
  }

  showEnd(success, score, hasNextLevel) {
    this.endModal.classList.remove('hidden');
    this.restartBtn.textContent = 'Retry';
    if (success) {
      this.endTitle.textContent = 'You Win!';
      this.endDesc.textContent = 'Great job! Final Score: ' + score;
      if (hasNextLevel) {
        this.nextLevelBtn.classList.remove('hidden');
      } else {
        this.nextLevelBtn.classList.add('hidden');
      }
    } else {
      this.endTitle.textContent = 'Game Over';
      this.endDesc.textContent = 'Final Score: ' + score + ' (Goal: ' + this.config.targetScore + '). Try again!';
      this.nextLevelBtn.classList.add('hidden');
    }
  }

  hideEnd() {
    this.endModal.classList.add('hidden');
  }

  bindStart(handler) {
    this.startBtn.addEventListener('click', handler);
  }

  bindRestart(handler) {
    this.restartBtn.addEventListener('click', handler);
  }

  bindNextLevel(handler) {
    this.nextLevelBtn.addEventListener('click', handler);
  }

  bindChooseOther(handler) {
    this.chooseOtherBtn.addEventListener('click', handler);
  }

  bindBackToMode(handler) {
    this.backToModeBtn.addEventListener('click', handler);
  }

  bindModeLabelClick(handler) {
    this.elMode.addEventListener('click', handler);
  }
}

/* ========================= GameLoop / App ========================= */
class MathCatGame {
  constructor() {
    this.config = GameConfig;
    this.canvas = document.getElementById('gameCanvas');
    this.ctx = this.canvas.getContext('2d');

    this.questionGenerator = new QuestionGenerator();
    this.state = new GameState(this.config);
    this.fishManager = new FishManager(this.config, this.questionGenerator);
    this.collisionManager = new CollisionManager(this.config);
    this.renderer = new Renderer(this.ctx, this.config);
    this.ui = new UI(this.config);
    this.effects = new EffectsManager();
    this.input = new InputManager(this.canvas, this.config, () => this.state.cat);

    this.currentMode = null;
    this.currentLevel = null;

    this.bounds = { width: 0, height: 0 };
    this.lastTime = null;
    this.successTimer = null;

    this._resize();
    window.addEventListener('resize', () => this._resize());
    window.addEventListener('orientationchange', () => {
      setTimeout(() => this._resize(), 200);
    });

    this.ui.bindStart(() => this._goModeSelect());
    this.ui.bindBackToMode(() => this._goModeSelect());
    this.ui.bindRestart(() => this._retryCurrentLevel());
    this.ui.bindNextLevel(() => this._goNextLevel());
    this.ui.bindModeLabelClick(() => this._goModeSelect());
    this.ui.bindChooseOther(() => this._goModeSelect());

    this.ui.showStart();
    this._loop = this._loop.bind(this);
    requestAnimationFrame(this._loop);
  }

  _goModeSelect() {
    if (this.state.status === 'playing') {
      this.state.status = 'idle';
    }
    this.ui.hideStart();
    this.ui.hideEnd();
    this.ui.renderModeList(GAME_MODES, (mode) => this._goLevelSelect(mode));
    this.ui.showModeSelect();
  }

  _goLevelSelect(mode) {
    this.currentMode = mode;
    this.ui.renderLevelList(mode, (level) => this.startGame(mode, level));
    this.ui.showLevelSelect();
  }

  _retryCurrentLevel() {
    if (this.currentMode && this.currentLevel) {
      this.startGame(this.currentMode, this.currentLevel);
    } else {
      this._goModeSelect();
    }
  }

  _goNextLevel() {
    const next = getNextLevelStep(this.currentMode, this.currentLevel);
    if (next) {
      this.startGame(next.mode, next.level);
    } else {
      this._goModeSelect();
    }
  }

  _resize() {
    const dpr = window.devicePixelRatio || 1;
    const w = window.innerWidth;
    const h = window.innerHeight;
    this.canvas.width = w * dpr;
    this.canvas.height = h * dpr;
    this.canvas.style.width = w + 'px';
    this.canvas.style.height = h + 'px';
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.bounds.width = w;
    this.bounds.height = h;

    if (this.state.status !== 'playing') {
      this.state.cat.x = w / 2;
      this.state.cat.y = h / 2;
    } else {
      this.input.clampCatToBounds(this.state.cat, this.bounds);
    }
  }

  startGame(mode, level) {
    if (this.successTimer) {
      clearTimeout(this.successTimer);
      this.successTimer = null;
    }
    this.currentMode = mode;
    this.currentLevel = level;

    this.state.reset(level);
    this.state.cat.x = this.bounds.width / 2;
    this.state.cat.y = this.bounds.height / 2;
    this.fishManager.reset();
    if (level.kind === 'multiplication' || level.kind === 'division') {
      this._spawnRoundBasedFish();
    } else {
      this.fishManager.fillToMax(level, this.state.cat.number, this.bounds);
    }
    this.effects.floatingTexts = [];
    this.effects.particles = [];
    this.effects.ripples = [];

    this.state.status = 'playing';
    this.ui.setModeLabel(mode, level);
    this.ui.hideStart();
    this.ui.hideModeSelect();
    this.ui.hideLevelSelect();
    this.ui.hideEnd();
    this.ui.hideSuccessToast();
    this.lastTime = null;
  }

  _spawnRoundBasedFish() {
    const level = this.currentLevel;
    const value = this.state.roundSequence[this.state.roundIndex];
    if (level.kind === 'multiplication') {
      const b = value;
      this.state.cat.number = level.base * b;
      this.state.cat.display = level.base + ' × ' + b;
      this.fishManager.spawnMultiplicationRound(level, level.base, b, this.bounds);
    } else if (level.kind === 'division') {
      const q = value;
      const dividend = level.divisor * q;
      this.state.cat.number = q;
      this.state.cat.display = dividend + ' ÷ ' + level.divisor;
      this.fishManager.spawnDivisionRound(level, level.divisor, q, this.bounds);
    }
  }

  _advanceRoundBasedRound() {
    this.fishManager.fishList = [];
    if (this.state.roundIndex >= this.state.roundMax - 1) {
      const success = this.state.score >= this.config.targetScore;
      this.endGame(success);
      return;
    }
    this.state.roundIndex += 1;
    this._spawnRoundBasedFish();
  }

  endGame(success) {
    this.state.status = success ? 'success' : 'fail';
    const hasNextLevel = !!getNextLevelStep(this.currentMode, this.currentLevel);
    if (success) {
      this.ui.showSuccessToast(this.state.score);
      this.successTimer = setTimeout(() => {
        this.ui.hideSuccessToast();
        this.ui.showEnd(true, this.state.score, hasNextLevel);
      }, this.config.successHoldTime);
    } else {
      this.ui.showEnd(false, this.state.score, hasNextLevel);
    }
  }

  _update(dt) {
    if (this.state.status !== 'playing') return;

    this.input.clampCatToBounds(this.state.cat, this.bounds);

    this.fishManager.update(dt, this.bounds);

    const isRoundBased = this.currentLevel &&
      (this.currentLevel.kind === 'multiplication' || this.currentLevel.kind === 'division');

    if (!isRoundBased) {
      this.fishManager.fillToMax(this.currentLevel, this.state.cat.number, this.bounds);
    }

    let ateThisFrame = false;
    this.collisionManager.checkAndResolve(
      this.state,
      this.fishManager,
      (fish, isCorrect, delta) => {
        this.effects.spawnScoreText(fish.x, fish.y - fish.radius, delta);
        this.effects.spawnEatBurst(fish.x, fish.y, fish.palette.body, isCorrect);
        ateThisFrame = true;
      },
      isRoundBased ? 1 : undefined
    );

    this.effects.update(dt);

    if (isRoundBased) {
      if (ateThisFrame) {
        this._advanceRoundBasedRound();
      }
      return;
    }

    this.state.timeRemaining -= dt;
    if (this.state.timeRemaining <= 0) {
      this.state.timeRemaining = 0;
      const success = this.state.score >= this.config.targetScore;
      this.endGame(success);
    }
  }

  _render(dt) {
    this.renderer.render(this.bounds.width, this.bounds.height, dt, this.fishManager, this.state.cat, this.effects);
    this.ui.updateHUD(this.state);
  }

  _loop(timestamp) {
    if (this.lastTime === null) this.lastTime = timestamp;
    const dt = Math.min(0.05, (timestamp - this.lastTime) / 1000);
    this.lastTime = timestamp;

    this._update(dt);
    this._render(dt);

    requestAnimationFrame(this._loop);
  }
}

window.addEventListener('load', () => {
  new MathCatGame();
});
</script>
