<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cat Chases Fish - Letter Tracing</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #E0F7FA;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none;
        }

        /* ===== Top: Category Bar ===== */
        #categoryBar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10;
            display: flex;
            justify-content: center;
            padding: 10px 10px 0;
            box-sizing: border-box;
            pointer-events: none;
        }
        #categoryTabs {
            pointer-events: auto;
            display: flex;
            gap: 6px;
            background: rgba(255, 255, 255, 0.9);
            padding: 5px;
            border-radius: 24px;
            box-shadow: 0 3px 14px rgba(0, 0, 0, 0.08);
            max-width: 100%;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-x;
        }
        #categoryTabs::-webkit-scrollbar {
            display: none;
        }
        .tab-btn {
            border: none;
            background: transparent;
            color: #888;
            font-size: 14px;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.15s ease, color 0.15s ease, transform 0.08s ease;
            flex: 0 0 auto;
        }
        .tab-btn.active {
            background: #4FC3F7;
            color: #fff;
        }
        .tab-btn:active {
            transform: scale(0.94);
        }

        /* ===== Bottom: Item Strip ===== */
        #itemBar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 10;
            box-sizing: border-box;
            padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
            background: linear-gradient(to top, rgba(255, 255, 255, 0.97) 60%, rgba(255, 255, 255, 0));
        }
        #itemStrip {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 4px 16px;
            scroll-snap-type: x proximity;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            touch-action: pan-x;
        }
        #itemStrip::-webkit-scrollbar {
            display: none;
        }
        .item-btn {
            flex: 0 0 auto;
            scroll-snap-align: center;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid #e5e5e5;
            background: #fff;
            color: #444;
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            cursor: pointer;
            transition: transform 0.1s ease, border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
        }
        .item-btn.active {
            background: #FF8C42;
            border-color: #FF8C42;
            color: #fff;
            transform: scale(1.1);
        }
        .item-btn:active {
            transform: scale(0.9);
        }
        .item-empty-tip {
            color: #999;
            font-size: 13px;
            padding: 8px;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }
    </style>
</head>

        /* ========================= Effects Manager ========================= */
        class EffectsManager {
            constructor() {
                this.particles = [];
                this.ripples = [];
            }

            spawnEffect(x, y) {
                for (let i = 0; i < 12; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 120 + 60;
                    this.particles.push({
                        x: x,
                        y: y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        radius: Math.random() * 4 + 2,
                        color: pathColor,
                        life: 0,
                        maxLife: Math.random() * 0.4 + 0.4
                    });
                }
                this.ripples.push({ x: x, y: y, life: 0, maxLife: 0.5 });
            }

            update(dt) {
                for (const p of this.particles) {
                    p.life += dt;
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    p.vy += 250 * dt;
                    p.vx *= 0.95;
                }
                this.particles = this.particles.filter(p => p.life < p.maxLife);

                for (const r of this.ripples) {
                    r.life += dt;
                }
                this.ripples = this.ripples.filter(r => r.life < r.maxLife);
            }

            render(ctx) {
                ctx.save();

                for (const r of this.ripples) {
                    const t = r.life / r.maxLife;
                    const radius = 15 + t * 55;
                    ctx.save();
                    ctx.globalAlpha = (1 - t) * 0.7;
                    ctx.strokeStyle = pathColor;
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(r.x, r.y, radius, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }

                for (const p of this.particles) {
                    const t = p.life / p.maxLife;
                    ctx.save();
                    ctx.globalAlpha = 1 - t;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius * (1 - t * 0.3), 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                ctx.restore();
            }
        }

        const effects = new EffectsManager();

        /* ========================= Path Generation ========================= */
        function getLinePath(p1, p2, step = 2) {
            const path = [];
            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            const distance = Math.hypot(dx, dy);
            const numPoints = Math.floor(distance / step);
            for (let i = 0; i <= numPoints; i++) {
                path.push({ x: p1.x + dx * (i / numPoints), y: p1.y + dy * (i / numPoints) });
            }
            return path;
        }

        function generateTrianglePath(cx, cy, size) {
            const p1 = { x: cx, y: cy - size };
            const p2 = { x: cx - size * 0.866, y: cy + size * 0.5 };
            const p3 = { x: cx + size * 0.866, y: cy + size * 0.5 };
            let l1 = getLinePath(p1, p2);
            let l2 = getLinePath(p2, p3);
            let l3 = getLinePath(p3, p1);
            l1.pop();
            l2.pop();
            return [].concat(l1, l2, l3);
        }

        function generateCirclePath(cx, cy, radius, step = 2) {
            const path = [];
            const circumference = 2 * Math.PI * radius;
            const numPoints = Math.floor(circumference / step);
            const startAngle = -Math.PI / 2;
            for (let i = 0; i <= numPoints; i++) {
                const angle = startAngle - ((i / numPoints) * 2 * Math.PI);
                path.push({
                    x: cx + radius * Math.cos(angle),
                    y: cy + radius * Math.sin(angle)
                });
            }
            return path;
        }

        function generateSquarePath(cx, cy, size) {
            const corner1 = { x: cx - size, y: cy - size };
            const corner2 = { x: cx + size, y: cy - size };
            const corner3 = { x: cx + size, y: cy + size };
            const corner4 = { x: cx - size, y: cy + size };

            let l1 = getLinePath(corner1, corner2);
            let l2 = getLinePath(corner2, corner3);
            let l3 = getLinePath(corner3, corner4);
            let l4 = getLinePath(corner4, corner1);
            l1.pop();
            l2.pop();
            l3.pop();
            return [].concat(l1, l2, l3, l4);
        }

        function generateHexagonPath(cx, cy, size) {
            const vertices = [];
            for (let i = 0; i < 6; i++) {
                const angle = -Math.PI / 2 + (i * Math.PI / 3);
                vertices.push({
                    x: cx + size * Math.cos(angle),
                    y: cy + size * Math.sin(angle)
                });
            }
            const segments = [];
            for (let i = 0; i < 6; i++) {
                const from = vertices[i];
                const to = vertices[(i + 1) % 6];
                segments.push(getLinePath(from, to));
            }
            for (let i = 0; i < 5; i++) {
                segments[i].pop();
            }
            return [].concat(...segments);
        }

        function generatePolygonPath(cx, cy, size, sides) {
            const vertices = [];
            for (let i = 0; i < sides; i++) {
                const angle = -Math.PI / 2 + (i * 2 * Math.PI / sides);
                vertices.push({ x: cx + size * Math.cos(angle), y: cy + size * Math.sin(angle) });
            }
            const segments = [];
            for (let i = 0; i < sides; i++) {
                segments.push(getLinePath(vertices[i], vertices[(i + 1) % sides]));
            }
            for (let i = 0; i < sides - 1; i++) segments[i].pop();
            return [].concat(...segments);
        }

        function generatePentagonPath(cx, cy, size) {
            return generatePolygonPath(cx, cy, size, 5);
        }

        function generateEllipsePath(cx, cy, rx, ry, step = 2) {
            const path = [];
            const approxCircumference = 2 * Math.PI * Math.max(rx, ry);
            const numPoints = Math.floor(approxCircumference / step);
            const startAngle = -Math.PI / 2;
            for (let i = 0; i <= numPoints; i++) {
                const angle = startAngle - ((i / numPoints) * 2 * Math.PI);
                path.push({ x: cx + rx * Math.cos(angle), y: cy + ry * Math.sin(angle) });
            }
            return path;
        }

        function generateRectPath(cx, cy, halfW, halfH) {
            const corner1 = { x: cx - halfW, y: cy - halfH };
            const corner2 = { x: cx + halfW, y: cy - halfH };
            const corner3 = { x: cx + halfW, y: cy + halfH };
            const corner4 = { x: cx - halfW, y: cy + halfH };
            let l1 = getLinePath(corner1, corner2);
            let l2 = getLinePath(corner2, corner3);
            let l3 = getLinePath(corner3, corner4);
            let l4 = getLinePath(corner4, corner1);
            l1.pop(); l2.pop(); l3.pop();
            return [].concat(l1, l2, l3, l4);
        }

        function generateRhombusPath(cx, cy, halfW, halfH) {
            const top = { x: cx, y: cy - halfH };
            const right = { x: cx + halfW, y: cy };
            const bottom = { x: cx, y: cy + halfH };
            const left = { x: cx - halfW, y: cy };
            let l1 = getLinePath(top, right);
            let l2 = getLinePath(right, bottom);
            let l3 = getLinePath(bottom, left);
            let l4 = getLinePath(left, top);
            l1.pop(); l2.pop(); l3.pop();
            return [].concat(l1, l2, l3, l4);
        }

        function generateStarPath(cx, cy, outerR, innerRatio = 0.382) {
            const innerR = outerR * innerRatio;
            const vertices = [];
            for (let i = 0; i < 10; i++) {
                const angle = -Math.PI / 2 + (i * Math.PI / 5);
                const r = (i % 2 === 0) ? outerR : innerR;
                vertices.push({ x: cx + r * Math.cos(angle), y: cy + r * Math.sin(angle) });
            }
            const segments = [];
            for (let i = 0; i < 10; i++) {
                segments.push(getLinePath(vertices[i], vertices[(i + 1) % 10]));
            }
            for (let i = 0; i < 9; i++) segments[i].pop();
            return [].concat(...segments);
        }

        function generateHeartPath(cx, cy, size, numPoints = 260) {
            const path = [];
            for (let i = 0; i <= numPoints; i++) {
                const t = (i / numPoints) * 2 * Math.PI;
                const hx = 16 * Math.pow(Math.sin(t), 3);
                const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                path.push({ x: cx + hx * (size / 17), y: cy + hy * (size / 17) });
            }
            return path;
        }

        /* ========================= Path Utils ========================= */
        function resamplePolyline(points, step) {
            if (points.length < 2) return points.slice();
            const cum = [0];
            for (let i = 1; i < points.length; i++) {
                cum.push(cum[i - 1] + Math.hypot(points[i].x - points[i - 1].x, points[i].y - points[i - 1].y));
            }
            const total = cum[cum.length - 1];
            if (total === 0) return [points[0]];
            const n = Math.max(1, Math.round(total / step));
            const result = [];
            let seg = 0;
            for (let i = 0; i <= n; i++) {
                const target = total * (i / n);
                while (seg < cum.length - 2 && cum[seg + 1] < target) seg++;
                const segLen = cum[seg + 1] - cum[seg];
                const t = segLen > 0 ? (target - cum[seg]) / segLen : 0;
                const a = points[seg], b = points[seg + 1];
                result.push({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
            }
            return result;
        }

        function catmullRomPoint(p0, p1, p2, p3, t) {
            const t2 = t * t, t3 = t2 * t;
            return {
                x: 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3),
                y: 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3)
            };
        }

        function smoothStroke(points, cornerThresholdDeg = 30, subdivisions = 8, smoothPull = 0.55) {
            const n = points.length;
            if (n < 3) return points.slice();
            const isHardCorner = new Array(n).fill(false);
            isHardCorner[0] = true;
            isHardCorner[n - 1] = true;
            for (let i = 1; i < n - 1; i++) {
                const a = points[i - 1], b = points[i], c = points[i + 1];
                const v1x = b.x - a.x, v1y = b.y - a.y;
                const v2x = c.x - b.x, v2y = c.y - b.y;
                const len1 = Math.hypot(v1x, v1y), len2 = Math.hypot(v2x, v2y);
                if (len1 < 1e-6 || len2 < 1e-6) { isHardCorner[i] = true; continue; }
                let dot = (v1x * v2x + v1y * v2y) / (len1 * len2);
                dot = Math.max(-1, Math.min(1, dot));
                const angleDeg = Math.acos(dot) * 180 / Math.PI;
                if (angleDeg > cornerThresholdDeg) isHardCorner[i] = true;
            }
            const result = [points[0]];
            for (let i = 0; i < n - 1; i++) {
                const p1 = points[i], p2 = points[i + 1];
                const rawP0 = (i === 0) ? p1 : points[i - 1];
                const rawP3 = (i + 2 >= n) ? p2 : points[i + 2];
                const p0 = isHardCorner[i] ? p1 : { x: p1.x + (rawP0.x - p1.x) * smoothPull, y: p1.y + (rawP0.y - p1.y) * smoothPull };
                const p3 = isHardCorner[i + 1] ? p2 : { x: p2.x + (rawP3.x - p2.x) * smoothPull, y: p2.y + (rawP3.y - p2.y) * smoothPull };
                for (let s = 1; s <= subdivisions; s++) {
                    result.push(catmullRomPoint(p0, p1, p2, p3, s / subdivisions));
                }
            }
            return result;
        }

        /* ========================= Hershey Vector Font Engine ========================= */
        function parseHersheyStrokes(d) {
            const tokens = d.trim().split(/\s+/);
            const strokes = [];
            let current = null;
            for (const tok of tokens) {
                const cmd = tok[0];
                const rest = (cmd === 'M' || cmd === 'L') ? tok.slice(1) : tok;
                if (cmd === 'M') { current = []; strokes.push(current); }
                const [x, y] = rest.split(',').map(Number);
                current.push({ x, y });
            }
            return strokes;
        }

        function generateHersheyLetterStrokes(cx, cy, size, glyph, heightRatio = 1.9) {
            let rawStrokes = parseHersheyStrokes(glyph.d);
            if (glyph.order && glyph.order.length === rawStrokes.length) {
                rawStrokes = glyph.order.map(idx => rawStrokes[idx]);
            }
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            for (const s of rawStrokes) for (const p of s) {
                if (p.x < minX) minX = p.x;
                if (p.x > maxX) maxX = p.x;
                if (p.y < minY) minY = p.y;
                if (p.y > maxY) maxY = p.y;
            }
            const centerX = (minX + maxX) / 2;
            const centerY = (minY + maxY) / 2;
            const scale = (size * heightRatio) / (maxY - minY || 1);
            return rawStrokes.map(pts => {
                const canvasPts = pts.map(p => ({
                    x: cx + (p.x - centerX) * scale,
                    y: cy + (p.y - centerY) * scale
                }));
                return resamplePolyline(smoothStroke(canvasPts), 2.2);
            });
        }

        /* ========================= Stroke Dispatcher ========================= */
        function generateStrokesForItem(cx, cy, size, item) {
            if (!item) return [generateCirclePath(cx, cy, size)];
            if (item.type === 'hershey') {
                return generateHersheyLetterStrokes(cx, cy, size, item);
            }
            if (item.type === 'procedural') {
                switch (item.generator) {
                    case 'circle': return [generateCirclePath(cx, cy, size)];
                    case 'triangle': return [generateTrianglePath(cx, cy, size)];
                    case 'square': return [generateSquarePath(cx, cy, size)];
                    case 'hexagon': return [generateHexagonPath(cx, cy, size)];
                    case 'pentagon': return [generatePentagonPath(cx, cy, size)];
                    case 'star': return [generateStarPath(cx, cy, size)];
                    case 'heart': return [generateHeartPath(cx, cy, size)];
                    case 'ellipse': return [generateEllipsePath(cx, cy, size * 1.3, size * 0.87)];
                    case 'rectangle': return [generateRectPath(cx, cy, size * 1.2, size * 0.8)];
                    case 'rhombus': return [generateRhombusPath(cx, cy, size * 0.75, size * 1.05)];
                    default: return [generateCirclePath(cx, cy, size)];
                }
            }
            return [generateCirclePath(cx, cy, size)];
        }

        function fitSizeToScreen(cx, cy, item, budgetLeft, budgetRight, budgetUp, budgetDown) {
            const TEST_SIZE = 100;
            const testStrokes = generateStrokesForItem(cx, cy, TEST_SIZE, item);
            let maxLeft = 0, maxRight = 0, maxUp = 0, maxDown = 0;
            for (const stroke of testStrokes) {
                for (const p of stroke) {
                    maxLeft = Math.max(maxLeft, cx - p.x);
                    maxRight = Math.max(maxRight, p.x - cx);
                    maxUp = Math.max(maxUp, cy - p.y);
                    maxDown = Math.max(maxDown, p.y - cy);
                }
            }
            const ratio = (budget, extent) => extent > 0.01 ? budget / extent : Infinity;
            const scale = Math.min(
                ratio(budgetLeft, maxLeft),
                ratio(budgetRight, maxRight),
                ratio(budgetUp, maxUp),
                ratio(budgetDown, maxDown)
            );
            return TEST_SIZE * scale;
        }

        function startGame(itemId) {
            currentShape = itemId;
            const cx = width / 2;
            const cy = CANVAS_MARGIN.top + (height - CANVAS_MARGIN.top - CANVAS_MARGIN.bottom) / 2;

            allStrokes = [];
            currentStrokeIndex = 0;

            const item = window.TRACE_DATA.items[itemId];
            const budgetLeft = cx - CANVAS_MARGIN.side;
            const budgetRight = (width - CANVAS_MARGIN.side) - cx;
            const budgetUp = cy - CANVAS_MARGIN.top;
            const budgetDown = (height - CANVAS_MARGIN.bottom) - cy;
            const fitSize = fitSizeToScreen(cx, cy, item, budgetLeft, budgetRight, budgetUp, budgetDown);
            allStrokes = generateStrokesForItem(cx, cy, fitSize, item);

            currentPath = allStrokes[0];
            pathColor = COLORS[Math.floor(Math.random() * COLORS.length)];
            currentPair = CHASE_PAIRS[Math.floor(Math.random() * CHASE_PAIRS.length)];

            catIndex = 0;
            fishIndex = Math.min(FISH_LEAD_POINTS, currentPath.length - 1);
            isDragging = false;
            isSuccess = false;
            effects.particles = [];
            effects.ripples = [];
        }

        /* ========================= Input Handling ========================= */
        function handleInput(x, y, isStart) {
            if (currentPath.length === 0 || isSuccess || strokeTransitionLock) return;

            const catPos = currentPath[catIndex];
            const distToCat = Math.hypot(x - catPos.x, y - catPos.y);

            if (isStart) {
                if (distToCat <= TOLERANCE_RADIUS) {
                    isDragging = true;
                }
                return;
            }

            if (isDragging) {
                if (distToCat > TOLERANCE_RADIUS) {
                    isDragging = false;
                    return;
                }

                let nextIndex = catIndex;
                let minDist = distToCat;

                for (let i = 1; i <= LOOK_AHEAD_POINTS; i++) {
                    if (catIndex + i >= currentPath.length) break;
                    const nextPos = currentPath[catIndex + i];
                    const distToNext = Math.hypot(x - nextPos.x, y - nextPos.y);
                    if (distToNext < minDist) {
                        minDist = distToNext;
                        nextIndex = catIndex + i;
                    }
                }

                if (nextIndex > catIndex) {
                    catIndex = nextIndex;
                    fishIndex = Math.min(catIndex + FISH_LEAD_POINTS, currentPath.length - 1);

                    if (catIndex >= currentPath.length - 12) {
                        catIndex = currentPath.length - 1;
                        isDragging = false;
                        const strokeEndPos = currentPath[currentPath.length - 1];
                        effects.spawnEffect(strokeEndPos.x, strokeEndPos.y);

                        if (currentStrokeIndex < allStrokes.length - 1) {
                            strokeTransitionLock = true;
                            setTimeout(() => {
                                currentStrokeIndex++;
                                currentPath = allStrokes[currentStrokeIndex];
                                catIndex = 0;
                                fishIndex = Math.min(FISH_LEAD_POINTS, currentPath.length - 1);
                                isSuccess = false;
                                strokeTransitionLock = false;
                            }, 500);
                        } else {
                            isSuccess = true;
                            setTimeout(() => {
                                startGame(currentShape);
                            }, 1500);
                        }
                    }
                }
            }
        }

        window.addEventListener('touchstart', e => {
            if (e.target.closest('#itemBar') || e.target.closest('#categoryBar')) return;
            handleInput(e.touches[0].clientX, e.touches[0].clientY, true);
        }, { passive: false });
        window.addEventListener('touchmove', e => {
            if (e.target.closest('#itemBar') || e.target.closest('#categoryBar')) return;
            e.preventDefault();
            if (e.touches.length > 0) handleInput(e.touches[0].clientX, e.touches[0].clientY, false);
        }, { passive: false });
        window.addEventListener('touchend', () => isDragging = false);

        window.addEventListener('mousedown', e => handleInput(e.clientX, e.clientY, true));
        window.addEventListener('mousemove', e => handleInput(e.clientX, e.clientY, false));
        window.addEventListener('mouseup', () => isDragging = false);

        window.addEventListener('resize', () => {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            startGame(currentShape);
        });

        /* ========================= Render Loop ========================= */
        let lastTime = performance.now();

        function loop(timestamp) {
            const dt = Math.min(0.05, (timestamp - lastTime) / 1000);
            lastTime = timestamp;

            fishWigglePhase += dt * FISH_WIGGLE_SPEED;
            catBobPhase += dt * CAT_BOB_SPEED;
            const catBreathTarget = isDragging ? 1 : (1 + Math.sin(catBobPhase) * CAT_BREATH_AMOUNT);
            catBreath += (catBreathTarget - catBreath) * Math.min(1, dt * 10);

            ctx.clearRect(0, 0, width, height);

            if (allStrokes.length > 0 && currentPath.length > 0) {
                // 1. Base track dot pattern
                ctx.save();
                ctx.globalAlpha = 1.0;
                ctx.fillStyle = "rgba(0, 0, 0, 0.15)";
                for (let s = 0; s < allStrokes.length; s++) {
                    const stroke = allStrokes[s];
                    for (let i = 0; i < stroke.length; i += 10) {
                        ctx.beginPath();
                        ctx.arc(stroke[i].x, stroke[i].y, 4.5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                ctx.restore();

                // 2. Color tracer path
                ctx.save();
                ctx.globalAlpha = 1.0;
                ctx.strokeStyle = pathColor;
                ctx.lineWidth = 26;
                ctx.lineCap = "round";
                ctx.lineJoin = "round";

                for (let s = 0; s < currentStrokeIndex; s++) {
                    const stroke = allStrokes[s];
                    if (stroke.length > 0) {
                        ctx.beginPath();
                        ctx.moveTo(stroke[0].x, stroke[0].y);
                        for (let i = 1; i < stroke.length; i++) {
                            ctx.lineTo(stroke[i].x, stroke[i].y);
                        }
                        ctx.stroke();
                    }
                }

                if (catIndex > 0 && currentPath.length > 0) {
                    ctx.beginPath();
                    ctx.moveTo(currentPath[0].x, currentPath[0].y);
                    for (let i = 1; i <= catIndex; i++) {
                        ctx.lineTo(currentPath[i].x, currentPath[i].y);
                    }
                    ctx.stroke();
                }
                ctx.restore();

                // 3. Prey
                if (!isSuccess) {
                    const fishPos = currentPath[fishIndex];
                    const fishWiggle = Math.sin(fishWigglePhase) * FISH_WIGGLE_AMOUNT;
                    ctx.save();
                    ctx.globalAlpha = 1.0;
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.translate(fishPos.x, fishPos.y);
                    ctx.rotate(fishWiggle);
                    ctx.font = PREY_FONT_SIZE + "px sans-serif";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText(currentPair.prey, 0, 0);
                    ctx.restore();
                }

                // 4. Visual effects
                effects.update(dt);
                effects.render(ctx);

                // 5. Hunter
                const catPos = currentPath[catIndex];
                const catBobY = isDragging ? 0 : Math.sin(catBobPhase) * CAT_BOB_AMOUNT;
                ctx.save();
                ctx.globalAlpha = 1.0;
                ctx.globalCompositeOperation = 'source-over';
                ctx.translate(catPos.x, catPos.y + catBobY);
                ctx.scale(1 / Math.sqrt(catBreath), catBreath);
                ctx.font = isDragging ? "84px sans-serif" : "78px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(currentPair.hunter, 0, 0);
                ctx.restore();
            }

            requestAnimationFrame(loop);
        }

        /* ========================= UI Controller ========================= */
        function buildCategoryUI() {
            const tabsEl = document.getElementById('categoryTabs');
            const itemsEl = document.getElementById('itemStrip');
            let activeCategoryId = window.TRACE_DATA.categories[0].id;

            function setActiveItem(itemId) {
                Array.from(itemsEl.children).forEach(btn => {
                    const isActive = btn.dataset.itemId === itemId;
                    btn.classList.toggle('active', isActive);
                    if (isActive) btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                });
            }

            function renderItems(catId) {
                const cat = window.TRACE_DATA.categories.find(c => c.id === catId);
                itemsEl.innerHTML = '';
                if (!cat || cat.items.length === 0) {
                    const tip = document.createElement('span');
                    tip.className = 'item-empty-tip';
                    tip.textContent = 'Coming Soon ✨';
                    itemsEl.appendChild(tip);
                    return;
                }
                cat.items.forEach(id => {
                    const def = window.TRACE_DATA.items[id];
                    const btn = document.createElement('button');
                    btn.className = 'item-btn';
                    btn.dataset.itemId = id;
                    btn.textContent = (def && def.label) ? def.label : id;
                    btn.onclick = () => {
                        setActiveItem(id);
                        startGame(id);
                    };
                    itemsEl.appendChild(btn);
                });
                itemsEl.scrollLeft = 0;
            }

            window.TRACE_DATA.categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'tab-btn' + (cat.id === activeCategoryId ? ' active' : '');
                btn.textContent = cat.label;
                btn.onclick = () => {
                    if (cat.id === activeCategoryId) return;
                    activeCategoryId = cat.id;
                    tabsEl.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                    renderItems(cat.id);
                    if (cat.items.length > 0) {
                        setActiveItem(cat.items[0]);
                        startGame(cat.items[0]);
                    }
                };
                tabsEl.appendChild(btn);
            });

            renderItems(activeCategoryId);
            const firstItems = window.TRACE_DATA.categories.find(c => c.id === activeCategoryId);
            if (firstItems && firstItems.items.length > 0) setActiveItem(firstItems.items[0]);
        }

        buildCategoryUI();
        const firstCategoryWithItems = window.TRACE_DATA.categories.find(c => c.items.length > 0) || window.TRACE_DATA.categories[0];
        startGame(firstCategoryWithItems.items[0] || 'circle');
        requestAnimationFrame(loop);
    </script>
</body>
