<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>游戏大厅 - 边玩边学</title>
    <style>
        :root {
            /* 更暖、更安静的底色 */
            --bg-top: #fdfbf7;
            --bg-bottom: #f5f6f2;
            --card-bg: #ffffff;
            --text-main: #2b2622;   /* 暖调深棕 */
            --text-muted: #85796e;  /* 暖灰 */
            --radius: 20px;

            /* 共用 token 别名：本页是其余页面的取值参照，命名与 DESIGN.md 一致 */
            --bg: #fdfbf7;
            --bg-2: #f5f6f2;
            --surface: #ffffff;
            --text: #2b2622;
            --muted: #85796e;
            --faint: #a89e92;
            --accent: #e0a87f;
            --accent-soft: #faf0e7;
            --accent-ink: #a2694a;
            --line: rgba(120,108,90,.10);
            --shadow: 0 6px 20px rgba(120,108,90,.07);
            --r-sm: 12px;
            --r-md: 20px;
            --r-lg: 28px;
            --emoji-sat: .85;  /* 与四个小游戏一致 */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px 20px;
            -webkit-font-smoothing: antialiased;
            background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
        }

        .back-nav {
            width: 100%;
            max-width: 480px;
            margin-bottom: 12px;
            text-align: left;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 12px;
            background-color: rgba(133, 121, 110, 0.07);
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .back-link:active {
            background-color: rgba(133, 121, 110, 0.13);
            transform: scale(0.97);
        }

        header {
            width: 100%;
            max-width: 480px;
            margin-bottom: 16px;
            text-align: center;
        }

        h1 {
            font-size: 32px;
            font-weight: 750;
            letter-spacing: -0.01em;
            display: inline-block;
            /* 暖色渐变字体，呼应卡片配色，活泼但不刺眼 */
            background-image: linear-gradient(90deg, #e0975a 0%, #d6708a 45%, #7c8fc4 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        p.subtitle {
            font-size: 15.5px;
            color: var(--text-muted);
            margin-top: 4px;
            line-height: 1.5;
        }

        main {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* 游戏卡片 */
        .game-card {
            background-color: var(--card-bg);
            border-radius: var(--radius);
            padding: 14px;
            text-decoration: none;
            color: inherit;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 6px 20px rgba(120, 108, 90, 0.07);
            border: 1px solid rgba(120, 108, 90, 0.06);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .game-card:active {
            transform: scale(0.97);
            box-shadow: 0 3px 10px rgba(120, 108, 90, 0.05);
        }

        .card-icon {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        /* 卡片图标底色：与各游戏内部主题色对应 */
        .icon-words { background-color: #fdf3e3; }      /* 浅橙黄 */
        .icon-write { background-color: #eaf3ec; }      /* 淡薄荷绿 */
        .icon-click { background-color: #eef2f6; }      /* 淡雾蓝 */
        .icon-challenge { background-color: #fdf1ed; }  /* 淡杏粉 */

        /* 图标 1: 缩小字号并增加外围 Padding，使四宫格内聚且边距舒适 */
        .icon-grid {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            padding: 12px;
        }
        .icon-grid span {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
        }

        /* 图标 2: 优化数字与草莓比例，与外框保持平衡呼吸感 */
        .icon-number {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px;
        }
        .icon-number .big-num {
            font-size: 34px;
            font-weight: 800;
            line-height: 1;
            color: #d6708a;
        }
        .icon-number .berry-row {
            display: flex;
            gap: 1px;
            font-size: 15px;
            line-height: 1;
            letter-spacing: -2px;
            margin-top: 2px;
        }

        /* 图标 3: 优化猫咪尺寸与爱心贴合位置，避免贴近外边框 */
        .icon-cat {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .icon-cat .cat-face {
            font-size: 42px;
            line-height: 1;
        }
        .icon-cat .heart {
            position: absolute;
            line-height: 1;
        }
        .icon-cat .heart-1 { top: 12px; right: 14px; font-size: 14px; }
        .icon-cat .heart-2 { top: 20px; right: 23px; font-size: 11px; opacity: 0.85; }

        /* 图标 4: 写写画画——大写"Aa"居中，右上角配一支顺时针转90度的小铅笔 */
        .icon-trace {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .icon-trace .trace-letters {
            font-size: 40px;
            font-weight: 800;
            line-height: 1;
            background-image: linear-gradient(90deg, #e0975a 0%, #d6708a 45%, #7c8fc4 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .icon-trace .badge-pencil {
            position: absolute;
            top: 12px;
            right: 12px;
            font-size: 22px;
            line-height: 1;
            transform: rotate(90deg);
        }

        /* 卡片图标里的 emoji 与四个小游戏共用同一个饱和度；
           只作用于 emoji 字符本身，卡片底色、渐变 Aa、数字 3 保持原样 */
        .icon-grid span,
        .icon-number .berry-row,
        .icon-cat .cat-face,
        .icon-cat .heart,
        .icon-trace .badge-pencil {
            filter: saturate(var(--emoji-sat));
        }

        .card-content {
            flex: 1;
            min-width: 0;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2px;
            gap: 8px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: #221f1c;
        }

        .age-badge {
            font-size: 12.5px;
            padding: 3px 9px;
            border-radius: 8px;
            font-weight: 600;
            white-space: nowrap;
        }

        .badge-words { background-color: #f7e8d2; color: #a2694a; }
        .badge-write { background-color: #dcebe0; color: #4a7d5c; }
        .badge-click { background-color: #dde5ee; color: #55688a; }
        .badge-challenge { background-color: #f6e3da; color: #a2694a; }

        .card-desc {
            font-size: 14.5px;
            color: #8a7f74;
            line-height: 1.5;
        }

        .arrow {
            color: #d8d0c6;
            font-size: 18px;
            margin-left: 2px;
            font-weight: bold;
            flex-shrink: 0;
        }

        footer {
            margin-top: 12px;
            font-size: 13.5px;
            color: #a89e92;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="back-nav">
        <a href="/zh/" class="back-link">🏠 返回</a>
    </div>

    <header>
        <h1>边玩边学</h1>
        <p class="subtitle">安静、轻松的日常认知与数学练习</p>
    </header>

    <main>
        <!-- 游戏 1: 生活中的词汇 -->
        <a href="/zh/games/words/index.html" class="game-card">
            <div class="card-icon icon-words">
                <div class="icon-grid">
                    <span>🍎</span><span>🚗</span>
                    <span>🐶</span><span>🛝</span>
                </div>
            </div>
            <div class="card-content">
                <div class="card-header">
                    <span class="card-title">生活中的词汇</span>
                    <span class="age-badge badge-words">3+</span>
                </div>
                <div class="card-desc">基础日常词汇与语言启蒙</div>
            </div>
            <span class="arrow">→</span>
        </a>

        <!-- 游戏 2: 写写画画 -->
        <a href="/zh/games/trace/index.html" class="game-card">
            <div class="card-icon icon-write">
                <div class="icon-trace">
                    <span class="trace-letters">Aa</span>
                    <span class="badge-pencil">✏️</span>
                </div>
            </div>
            <div class="card-content">
                <div class="card-header">
                    <span class="card-title">写写画画</span>
                    <span class="age-badge badge-write">4+</span>
                </div>
                <div class="card-desc">帮小动物吃到美食，画出字母、数字和图形</div>
            </div>
            <span class="arrow">→</span>
        </a>

        <!-- 游戏 3: 数字点点 -->
        <a href="/zh/games/math-click/index.html" class="game-card">
            <div class="card-icon icon-click">
                <div class="icon-number">
                    <span class="big-num">3</span>
                    <span class="berry-row">🍓🍓🍓</span>
                </div>
            </div>
            <div class="card-content">
                <div class="card-header">
                    <span class="card-title">数字点点</span>
                    <span class="age-badge badge-click">3+</span>
                </div>
                <div class="card-desc">认识数字、数数与基础运算</div>
            </div>
            <span class="arrow">→</span>
        </a>

        <!-- 游戏 4: 数学挑战 (小猫吃鱼) -->
        <a href="/zh/games/math-challenge/index.html" class="game-card">
            <div class="card-icon icon-challenge">
                <div class="icon-cat">
                    <span class="cat-face">🐱</span>
                    <span class="heart heart-1">❤️</span>
                    <span class="heart heart-2">❤️</span>
                </div>
            </div>
            <div class="card-content">
                <div class="card-header">
                    <span class="card-title">数学挑战</span>
                    <span class="age-badge badge-challenge">6+</span>
                </div>
                <div class="card-desc">拖动小猫吃掉正确的鱼，喂饱它</div>
            </div>
            <span class="arrow">→</span>
        </a>
    </main>

    <footer>
        <p>Growy · 陪伴与新生</p>
    </footer>

</body>
</html>
