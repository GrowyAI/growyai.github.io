<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>幼儿认知小游戏</title>
<style>
    html,
    body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #7fc8f0;
        -webkit-user-select: none;
        user-select: none;
        touch-action: none;
        font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    #gameCanvas {
        display: block;
        margin: 0 auto;
        background: #eaf7ff;
        touch-action: none;
    }
    /* 设置入口按钮：跟"返回菜单"按钮同一种浅色风格，避免视觉割裂 */
    .settings-toggle {
        position: fixed;
        top: 10px;
        right: 10px;
        z-index: 100;
        width: 36px;
        height: 36px;
        padding: 0;
        border: none;
        border-radius: 50%;
        background: rgba(43,88,118,0.15);
        color: #2b5876;
        font-size: 18px;
        line-height: 36px;
        text-align: center;
        -webkit-user-select: none;
        user-select: none;
    }

    /* 遮罩层 */
    .settings-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        z-index: 1000;
        align-items: center;
        justify-content: center;
    }
    .settings-overlay.show {
        display: flex;
    }

    /* 弹窗卡片 */
    .settings-panel {
        background: #fff;
        border-radius: 28px;
        padding: 24px 22px 28px;
        width: 90%;
        max-width: 360px;
        box-shadow: 0 12px 48px rgba(0,0,0,0.15);
        display: flex;
        flex-direction: column;
        gap: 18px;
        font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    /* 头部 */
    .settings-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    .settings-title {
        font-size: 20px;
        font-weight: 700;
        color: #2b5876;
    }
    .settings-close {
        background: #f0ebe4;
        border: none;
        border-radius: 50%;
        width: 34px;
        height: 34px;
        font-size: 16px;
        cursor: pointer;
    }

    /* 每个设置组 */
    .setting-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }
    .setting-label {
        font-size: 15px;
        font-weight: 600;
        color: #555;
    }

    /* 选项按钮行 */
    .option-row {
        display: flex;
        gap: 10px;
    }
    .option-btn {
        flex: 1;
        padding: 10px 14px;
        border: 2px solid #e0dad4;
        border-radius: 24px;
        background: #fcfaf8;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
        text-align: center;
        color: #555;
        transition: all 0.15s;
    }
    .option-btn:active {
        transform: scale(0.95);
    }

    /* 选中状态 */
    .option-btn.active {
        border-color: #b8d4a8;
        background: #f1f8ea;
        color: #1a1a1a;
        font-weight: 700;
    }
</style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <button id="settingsToggle" class="settings-toggle" aria-label="设置">⚙️</button>
    <div id="settingsOverlay" class="settings-overlay">
        <div class="settings-panel">
            <div class="settings-header">
                <div class="settings-title">设置</div>
                <button id="settingsClose" class="settings-close">✕</button>
            </div>
            <div class="setting-group">
                <div class="setting-label">语言 Language</div>
                <div class="option-row">
                    <button id="optLangZh" class="option-btn">中文</button>
                    <button id="optLangEn" class="option-btn">EN</button>
                </div>
            </div>
            <div class="setting-group">
                <div class="setting-label">声音 Sound</div>
                <div class="option-row">
                    <button id="optSoundOn" class="option-btn">🔊 开启</button>
                    <button id="optSoundOff" class="option-btn">🔇 静音</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        'use strict';

        /* =========================================================
           中英文切换
        ========================================================= */
        let isEnglish = false;

        const translations = {
            selectMode: { zh: '选择模式', en: 'Select Mode' },
            menu: { zh: '菜单', en: 'Menu' },
            continueBtn: { zh: '继续', en: 'Continue' }
        };

        function t(key) {
            return translations[key][isEnglish ? 'en' : 'zh'];
        }

        // 分组/关卡标题：有 titleEn 且当前是英文就用 titleEn，否则用中文原文
        function groupTitle(g) {
            return (isEnglish && g.titleEn) ? g.titleEn : g.title;
        }
        function levelTitle(level) {
            return (isEnglish && level.titleEn) ? level.titleEn : level.title;
        }

        function setLanguage(en) {
            isEnglish = en;
            // 菜单按钮 / 选关下拉菜单的文字是布局时就存好的，切换语言后需要重新布局才能刷新
            if (Game.mode === 'menu') UI.layoutMenu(Game.cw, Game.ch);
            if (UI.levelMenuOpen) UI.layoutLevelMenu(Game.cw);
            document.getElementById('optLangZh').classList.toggle('active', !isEnglish);
            document.getElementById('optLangEn').classList.toggle('active', isEnglish);
        }

        /* =========================================================
           发音引擎（数字 & 算式朗读，中英文跟随语言设置）
        ========================================================= */
        function numToZh(n) {
            const map = ['零','一','二','三','四','五','六','七','八','九','十'];
            if (n <= 10) return map[n];
            if (n < 20) return '十' + (n % 10 ? map[n % 10] : '');
            if (n < 100) {
                const tens = Math.floor(n / 10);
                const ones = n % 10;
                return map[tens] + '十' + (ones ? map[ones] : '');
            }
            return String(n);
        }
        function numToEn(n) {
            const map = ['zero','one','two','three','four','five','six','seven','eight','nine','ten',
                'eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];
            return n <= 20 ? map[n] : String(n);
        }

        const Sound = {
            enabled: true,
            _cachedVoices: { zh: null, en: null },

            getVoice(lang) {
                if (!window.speechSynthesis) return null;
                const voices = speechSynthesis.getVoices();
                if (!voices.length) return null;
                if (this._cachedVoices[lang]) return this._cachedVoices[lang];
                let voice;
                if (lang === 'en') {
                    voice = voices.find(v => v.lang.startsWith('en-US')) ||
                            voices.find(v => v.lang.startsWith('en')) || null;
                } else {
                    voice = voices.find(v => v.lang.startsWith('zh-CN')) ||
                            voices.find(v => v.lang.startsWith('zh')) || null;
                }
                this._cachedVoices[lang] = voice;
                return voice;
            },

            speak(text, lang) {
                if (!this.enabled || !text || !window.speechSynthesis) return;
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(String(text));
                u.lang = lang === 'en' ? 'en-US' : 'zh-CN';
                u.rate = 0.85;
                u.pitch = 1.1;
                const voice = this.getVoice(lang);
                if (voice) u.voice = voice;
                speechSynthesis.speak(u);
            },

            // 数字发音：放入水果时读出当前容器展示的数字
            speakNumber(n) {
                if (n === undefined || n === null) return;
                const lang = isEnglish ? 'en' : 'zh';
                const text = isEnglish ? numToEn(n) : numToZh(n);
                this.speak(text, lang);
            },

            // 算式发音：关卡完成时读出完整加法/减法算式
            speakFormula(a, op, b, result) {
                if (isEnglish) {
                    const opWord = op === '+' ? 'plus' : 'minus';
                    this.speak(`${numToEn(a)} ${opWord} ${numToEn(b)} equals ${numToEn(result)}`, 'en');
                } else {
                    const opZh = op === '+' ? '加' : '减';
                    this.speak(`${numToZh(a)}${opZh}${numToZh(b)}等于${numToZh(result)}`, 'zh');
                }
            },

            toggle() {
                this.enabled = !this.enabled;
                if (!this.enabled && window.speechSynthesis) {
                    window.speechSynthesis.cancel();
                }
                return this.enabled;
            }
        };

        /* =========================================================
           工具函数
        ========================================================= */
        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        }

        function dist(x1, y1, x2, y2) { return Math.hypot(x1 - x2, y1 - y2); }

        function rand(a, b) { return a + Math.random() * (b - a); }

        // ---- 全局统一的"卡片/固定格子"视觉规范 ----
        // 以"拖动滑块"（drawBundleToken / drawAddendGroup 的白底卡片）为基准，
        // 所有容器的外框（grid 数数方格盘、equationRow 加法算式行、subtractionRow 减法算式行）
        // 都复用同一套圆角、描边粗细，视觉上和滑块保持统一；
        // CARD_PAD 用来把容器外框在内容之外再外扩一圈，弥补滑块卡片自带留白、而容器格子紧贴内容显得偏小的问题。
        const CARD_RADIUS = 14;
        const CARD_BORDER = 3;
        const CARD_BORDER_DONE = 5; // 完成态描边保留一点点加粗做庆祝反馈，但比之前的6更克制
        const CARD_PAD = 8;

        // ---- 水果束（bundle token）通用逻辑 ----
        // 一个 token 可以代表 N 个计数单位（N=1 就是普通单个水果）。
        // count by 2/5/10 就是靠这个：点一下 = 一次放进 N 个，数字一次跳 N。
        // bundleLayout 统一计算卡片尺寸和内部小图标排布，drawBundleToken/bundleRadius 都复用它，避免两处数值不一致。
        //
        // 注意：卡片内部小图标大小用固定基准值（不跟着各关卡里"放进格子后的水果图标大小"缩放），
        // 这样调整水果图标大小时，束卡片的宽度/排列不会跟着变，不会出现卡片放不下的问题。
        const BUNDLE_ICON_BASE = 20;
        function bundleLayout(n) {
            const cols = Math.min(5, n);
            const rows = Math.ceil(n / cols);
            const miniR = BUNDLE_ICON_BASE * 0.55;
            const pitch = miniR * 2.3;
            const cardW = cols * pitch + miniR * 1.2;
            const cardH = rows * pitch + miniR * 1.2;
            return { cols, rows, miniR, pitch, cardW, cardH };
        }

        function bundleRadius(n) {
            const L = bundleLayout(n);
            return Math.max(L.cardW, L.cardH) / 2 + 4;
        }

        function drawBundleToken(ctx, item) {
            const n = item.unitCount;
            const L = bundleLayout(n);
            ctx.save();
            ctx.fillStyle = 'rgba(255,255,255,0.92)';
            roundRect(ctx, -L.cardW / 2, -L.cardH / 2, L.cardW, L.cardH, CARD_RADIUS);
            ctx.fill();
            ctx.lineWidth = CARD_BORDER;
            ctx.strokeStyle = '#ffb74d';
            ctx.stroke();

            const typeDef = Config.itemTypes[item.type];
            for (let i = 0; i < n; i++) {
                const row = Math.floor(i / L.cols);
                const itemsInRow = Math.min(n - row * L.cols, L.cols);
                const rowStartX = -((itemsInRow - 1) * L.pitch) / 2;
                const col = i % L.cols;
                const x = rowStartX + col * L.pitch;
                const y = -((L.rows - 1) * L.pitch) / 2 + row * L.pitch;
                ctx.save();
                ctx.translate(x, y);
                if (typeDef && typeDef.draw) typeDef.draw(ctx, L.miniR);
                ctx.restore();
            }
            ctx.restore();
        }

        // ---- 加法关卡"整组"待拖入水果的绘制：大小、间距和目标行的格子完全一致 ----
        function drawAddendGroup(ctx, item) {
            const n = item.count;
            const pitch = item.cell + item.cellGap;
            const groupW = n * item.cell + (n - 1) * item.cellGap;
            const groupH = item.cell;

            // 不透明的白色卡片底板（和其它水果束卡片的风格保持一致，方便小朋友一眼看出这是可以整体拖动的一组）
            ctx.save();
            ctx.fillStyle = 'rgba(255,255,255,0.92)';
            roundRect(ctx, -groupW / 2 - 6, -groupH / 2 - 6, groupW + 12, groupH + 12, CARD_RADIUS);
            ctx.fill();
            ctx.lineWidth = CARD_BORDER;
            ctx.strokeStyle = '#ffb74d';
            ctx.stroke();
            ctx.restore();

            const typeDef = Config.itemTypes[item.type];
            for (let k = 0; k < n; k++) {
                const x = -groupW / 2 + item.cell / 2 + k * pitch;
                ctx.save();
                ctx.translate(x, 0);
                if (typeDef && typeDef.draw) typeDef.draw(ctx, item.r);
                ctx.restore();
            }
        }

        // 通用的"目标数字"绘制逻辑：所有 containerType 共用同一套视觉规则
        // （未填满=浅灰色（或自定义 idleColor），填满=放大变彩色并描白边）
        // container.displayValue 优先于 container.value：
        //   - "目标模式"（比如数字1-10）：displayValue 恒等于 value，数字本身不随进度变化
        //   - "数数模式"（比如从11数到20）：displayValue 随每次放入而递增，直观展示"数到几了"
        function drawContainerLabel(ctx, container) {
            const full = container.items.length >= container.capacity;
            const val = container.displayValue !== undefined ? container.displayValue : container.value;
            ctx.save();
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.translate(container.x, container.labelY);
            ctx.scale(container.numberScale || 1, container.numberScale || 1);
            ctx.font = `bold ${container.labelFontSize}px sans-serif`;
            if (full) {
                ctx.lineWidth = 6;
                ctx.strokeStyle = '#ffffff';
                ctx.strokeText(String(val), 0, 0);
                ctx.fillStyle = container.completeColor || '#43a047';
            } else {
                ctx.fillStyle = container.idleColor || '#cdd8dd';
            }
            ctx.fillText(String(val), 0, 0);
            ctx.restore();
        }

        /* =========================================================
           Config 模块
           —— 物品类型 / 容器类型 / 关卡数据 全部注册在这里

           containerTypes 插件契约（新增容器类型都要实现这四个方法）：
             computeDims(cw, count, level) -> { width, height, gap, labelFontSize, ...额外字段 }
             slotLayout(n, dims)           -> [{x,y}, ...]  相对容器中心的偏移坐标
             draw(ctx, container)          -> 画容器本体 + 空位占位
             drawLabel(ctx, container)     -> 画容器下方的目标数字（通常直接调用 drawContainerLabel）
        ========================================================= */
        const Config = {
            itemRadius: 20,

            // 🍎🍌🍓🍊🍇🍉🍑🍒 —— 丰富食物类型
            itemTypes: {
                apple: { emoji: '🍎', draw(ctx, r) { ctx.save(); ctx.font = `${r*2.15}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('🍎', 0, r * 0.08); ctx.restore(); } },
                banana: { emoji: '🍌', draw(ctx, r) { ctx.save(); ctx.font = `${r*2.15}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('🍌', 0, r * 0.08); ctx.restore(); } },
                strawberry: { emoji: '🍓', draw(ctx, r) { ctx.save(); ctx.font = `${r*2.15}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('🍓', 0, r * 0.08); ctx.restore(); } },
                orange: { emoji: '🍊', draw(ctx, r) { ctx.save(); ctx.font = `${r*2.15}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('🍊', 0, r * 0.08); ctx.restore(); } },
                grape: { emoji: '🍇', draw(ctx, r) { ctx.save(); ctx.font = `${r*2.15}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('🍇', 0, r * 0.08); ctx.restore(); } },
                watermelon: { emoji: '🍉', draw(ctx, r) { ctx.save(); ctx.font = `${r*2.15}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('🍉', 0, r * 0.08); ctx.restore(); } },
                peach: { emoji: '🍑', draw(ctx, r) { ctx.save(); ctx.font = `${r*2.15}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('🍑', 0, r * 0.08); ctx.restore(); } },
                cherry: { emoji: '🍒', draw(ctx, r) { ctx.save(); ctx.font = `${r*2.15}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('🍒', 0, r * 0.08); ctx.restore(); } }
            },

            foodTypeKeys: ['apple', 'banana', 'strawberry', 'orange', 'grape', 'watermelon', 'peach', 'cherry'],

            containerTypes: {
                // ---- plate：正圆盘子（数字1-10认识数量用）----
                plate: {
                    // 所有盘子统一大小；外径留足余量，最多允许 10 个水果溢出到第 4 行
                    plateBaseDiameter: 260,
                    // 每行最多 3 个，整体（不只是单行）上下左右居中
                    // 1 个水果时正好在圆心
                    gridCols: 3,
                    // 填满后弹跳出现的活泼低饱和度颜色（红黄蓝绿橙棕紫）
                    completeColors: ['#e57373', '#ffb74d', '#fdd85d', '#81c784', '#64b5f6', '#ba68c8', '#a1887f'],

                    // 根据画布宽度和盘子数量，算出统一的盘子直径（水果大小固定不变）
                    computeDims(cw, count) {
                        const sideMargin = 20;
                        const gap = 24;
                        const maxAvailable = (cw - sideMargin * 2 - gap * (count - 1)) / count;
                        const plateD = Math.max(150, Math.min(this.plateBaseDiameter, maxAvailable));
                        const labelFontSize = Math.max(70, Math.round(120 * (plateD / this.plateBaseDiameter)));
                        return { width: plateD, height: plateD, gap, labelFontSize };
                    },

                    // 生成 n 个水果在盘子里的固定位置：每行最多 3 个，整体居中
                    // （1 个水果 = 单独在圆心；最后一行不满也单独居中；行数不够就往下多加一行，10 个会溢出到第 4 行）
                    slotLayout(n) {
                        const cols = Math.min(this.gridCols, n);
                        const rows = Math.ceil(n / cols);
                        const spacing = Config.itemRadius * 2.3;
                        const positions = [];
                        for (let i = 0; i < n; i++) {
                            const row = Math.floor(i / cols);
                            const itemsInRow = Math.min(n - row * cols, cols);
                            const startX = -((itemsInRow - 1) * spacing) / 2;
                            const startY = -((rows - 1) * spacing) / 2;
                            const col = i % cols;
                            positions.push({
                                x: startX + col * spacing,
                                y: startY + row * spacing
                            });
                        }
                        return positions;
                    },

                    draw(ctx, container) {
                        const r = container.width / 2;
                        const full = container.items.length >= container.capacity;
                        ctx.save();
                        ctx.translate(container.x, container.y);

                        // 阴影
                        ctx.fillStyle = 'rgba(0,0,0,0.10)';
                        ctx.beginPath();
                        ctx.arc(0, r * 0.06, r, 0, Math.PI * 2);
                        ctx.fill();

                        // 盘边（正圆）
                        const rim = ctx.createLinearGradient(0, -r, 0, r);
                        rim.addColorStop(0, '#ffffff');
                        rim.addColorStop(1, '#cfe8f5');
                        ctx.fillStyle = rim;
                        ctx.beginPath();
                        ctx.arc(0, 0, r, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.lineWidth = full ? 6 : 4;
                        ctx.strokeStyle = full ? '#43a047' : '#9fc9de';
                        ctx.stroke();

                        // 盘心
                        const inner = ctx.createRadialGradient(0, -r * 0.1, 4, 0, 0, r * 0.82);
                        inner.addColorStop(0, '#ffffff');
                        inner.addColorStop(1, '#e4f3fa');
                        ctx.fillStyle = inner;
                        ctx.beginPath();
                        ctx.arc(0, 0, r * 0.82, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.lineWidth = 2;
                        ctx.strokeStyle = 'rgba(120,170,190,0.5)';
                        ctx.stroke();

                        // 预先摆好的水果（已经会数的部分，静态展示，不需要互动）
                        if (container.prefillCount) {
                            const itemDef = Config.itemTypes[container.prefillType];
                            for (let i = 0; i < container.prefillCount; i++) {
                                const s = container.slots[i];
                                ctx.save();
                                ctx.translate(s.x, s.y);
                                if (itemDef && itemDef.draw) itemDef.draw(ctx, container.itemR);
                                ctx.restore();
                            }
                        }

                        // 空位提示：浅灰色圆形占位（不显示任何数字）
                        ctx.fillStyle = 'rgba(120,140,150,0.18)';
                        for (let i = container.items.length; i < container.capacity; i++) {
                            const s = container.slots[container.slotOffset + i];
                            ctx.beginPath();
                            ctx.arc(s.x, s.y, container.itemR, 0, Math.PI * 2);
                            ctx.fill();
                        }

                        ctx.restore();
                    },

                    // 目标数字：位于盘子下方，未填满为浅灰，填满后放大变色并弹跳
                    drawLabel(ctx, container) { drawContainerLabel(ctx, container); }
                },

                // ---- grid：方格条（给数字更多/数到100/加减法等后续玩法用的形状，暂未接入关卡）----
                grid: {
                    cellSize: 56,
                    cellGap: 10,
                    maxCols: 5,
                    completeColors: ['#e57373', '#ffb74d', '#fdd85d', '#81c784', '#64b5f6', '#ba68c8', '#a1887f'],

                    // level.gridCols 可覆盖每行格子数；根据"预填充+互动"两部分的总格子数算出需要几行
                    computeDims(cw, count, level) {
                        const cols = (level && level.gridCols) || this.maxCols;
                        let maxVal = cols;
                        if (level && level.boxNumbers && level.boxNumbers.length) {
                            maxVal = Math.max(...level.boxNumbers.map((v, i) =>
                                v + ((level.prefillCount && level.prefillCount[i]) || 0)));
                        }
                        const rows = Math.max(1, Math.ceil(maxVal / cols));

                        const sideMargin = 20, outerGap = 24;
                        const maxAvailableW = (cw - sideMargin * 2 - outerGap * (count - 1)) / count;
                        const pitchByWidth = (maxAvailableW - (cols - 1) * 4) / cols;
                        const cell = Math.max(28, Math.min(this.cellSize, pitchByWidth));
                        const cellGap = Math.max(4, Math.round(cell * 0.15));

                        const width = cols * cell + (cols - 1) * cellGap;
                        const height = rows * cell + (rows - 1) * cellGap;
                        const labelFontSize = Math.max(50, Math.round(cell * 1.5));
                        return { width, height, gap: outerGap, labelFontSize, cols, rows, cell, cellGap };
                    },

                    // n 个方格按 cols 自动换行，整体（不只单行）上下左右居中
                    slotLayout(n, dims) {
                        const { cols, cell, cellGap } = dims;
                        const rows = Math.max(1, Math.ceil(n / cols));
                        const pitch = cell + cellGap;
                        const totalW = cols * cell + (cols - 1) * cellGap;
                        const totalH = rows * cell + (rows - 1) * cellGap;
                        const positions = [];
                        for (let i = 0; i < n; i++) {
                            const row = Math.floor(i / cols);
                            const col = i % cols;
                            positions.push({
                                x: -totalW / 2 + cell / 2 + col * pitch,
                                y: -totalH / 2 + cell / 2 + row * pitch
                            });
                        }
                        return positions;
                    },

                    draw(ctx, container) {
                        const w = container.width, h = container.height;
                        const full = container.items.length >= container.capacity;
                        ctx.save();
                        ctx.translate(container.x, container.y);

                        // 外框整体外扩 CARD_PAD，视觉尺寸和拖动滑块的白卡片保持一致（不影响内部水果的实际位置）
                        const pw = w + CARD_PAD * 2, ph = h + CARD_PAD * 2;

                        // 阴影
                        ctx.fillStyle = 'rgba(0,0,0,0.10)';
                        roundRect(ctx, -pw / 2, -ph / 2 + ph * 0.05, pw, ph, CARD_RADIUS);
                        ctx.fill();

                        // 底板
                        const bg = ctx.createLinearGradient(0, -ph / 2, 0, ph / 2);
                        bg.addColorStop(0, '#ffffff');
                        bg.addColorStop(1, '#dff0f7');
                        ctx.fillStyle = bg;
                        roundRect(ctx, -pw / 2, -ph / 2, pw, ph, CARD_RADIUS);
                        ctx.fill();
                        ctx.lineWidth = full ? CARD_BORDER_DONE : CARD_BORDER;
                        ctx.strokeStyle = full ? '#43a047' : '#9fc9de';
                        ctx.stroke();

                        // 预先摆好的水果（已经会数的部分，静态展示，不需要互动）
                        if (container.prefillCount) {
                            const itemDef = Config.itemTypes[container.prefillType];
                            for (let i = 0; i < container.prefillCount; i++) {
                                const s = container.slots[i];
                                ctx.save();
                                ctx.translate(s.x, s.y);
                                if (itemDef && itemDef.draw) itemDef.draw(ctx, container.itemR);
                                ctx.restore();
                            }
                        }

                        // 空位提示：浅灰色方形占位
                        ctx.fillStyle = 'rgba(120,140,150,0.18)';
                        const size = (container.cell || 40) * 0.82;
                        for (let i = container.items.length; i < container.capacity; i++) {
                            const s = container.slots[container.slotOffset + i];
                            roundRect(ctx, s.x - size / 2, s.y - size / 2, size, size, 8);
                            ctx.fill();
                        }

                        ctx.restore();
                    },

                    drawLabel(ctx, container) { drawContainerLabel(ctx, container); }
                },

                // ---- equationRow：一排格子，前一部分预先摆好（加数a），后一部分要拖水果进去（加数b）----
                // 用于"10以内加法"：下方文字显示 "a + b = ?"，放满后变成 "a + b = 和"
                equationRow: {
                    cellSize: 56,
                    aZoneColor: '#dff0f7',     // 已经摆好的a：浅蓝底
                    bZoneColor: '#ffe9c7',     // 等着拖入的b：浅橙底
                    completeColors: ['#e57373', '#ffb74d', '#fdd85d', '#81c784', '#64b5f6', '#ba68c8', '#a1887f'],

                    // 一整条连续的格子（不是c个分开的方块），一排放下 level.sum 个位置，会自动缩小以放得下
                    computeDims(cw, count, level) {
                        const cols = level.sum;
                        const sideMargin = 20, outerGap = 24;
                        const maxAvailableW = (cw - sideMargin * 2 - outerGap * (count - 1)) / count;
                        const pitchByWidth = (maxAvailableW - (cols - 1) * 4) / cols;
                        const cell = Math.max(24, Math.min(this.cellSize, pitchByWidth));
                        const cellGap = Math.max(4, Math.round(cell * 0.15));
                        const width = cols * cell + (cols - 1) * cellGap;
                        const height = cell;
                        // 算式文字比其它关卡放大一倍；超宽屏幕能放下时按此大小，等式过长时 drawLabel 里会按需缩小避免溢出
                        const labelFontSize = Math.max(48, Math.min(72, Math.round(cw * 0.15)));
                        return {
                            width, height, gap: outerGap, labelFontSize, cols, cell, cellGap,
                            maxLabelWidth: cw - 40,
                            eqA: level.a, eqB: level.b, eqSum: level.sum
                        };
                    },

                    // n 个位置排成一行，整体居中（只用来定位水果，不再各自画边框）
                    slotLayout(n, dims) {
                        const { cell, cellGap } = dims;
                        const pitch = cell + cellGap;
                        const totalW = n * cell + (n - 1) * cellGap;
                        const positions = [];
                        for (let i = 0; i < n; i++) {
                            positions.push({ x: -totalW / 2 + cell / 2 + i * pitch, y: 0 });
                        }
                        return positions;
                    },

                    draw(ctx, container) {
                        const w = container.width, h = container.height;
                        const full = container.items.length >= container.capacity;
                        const prefillN = container.prefillCount || 0;
                        const aW = (w * prefillN) / container.cols;
                        ctx.save();
                        ctx.translate(container.x, container.y);

                        // 外框整体外扩 CARD_PAD，视觉尺寸和拖动滑块的白卡片保持一致；
                        // 左右两块底色的分界线仍然对齐实际内容（水果）所在的位置，只是外框边缘各自往外多包一圈
                        const pw = w + CARD_PAD * 2, ph = h + CARD_PAD * 2;
                        const leftZoneW = CARD_PAD + aW;

                        // 阴影
                        ctx.fillStyle = 'rgba(0,0,0,0.10)';
                        roundRect(ctx, -pw / 2, -ph / 2 + ph * 0.05, pw, ph, CARD_RADIUS);
                        ctx.fill();

                        // 一整条连续的底板，裁剪出左右两块底色区分"已经有的a"和"要加的b"，
                        // 但整体只有一个外框，不是一格一格分开的
                        ctx.save();
                        roundRect(ctx, -pw / 2, -ph / 2, pw, ph, CARD_RADIUS);
                        ctx.clip();
                        ctx.fillStyle = this.aZoneColor;
                        ctx.fillRect(-pw / 2, -ph / 2, leftZoneW, ph);
                        if (prefillN < container.cols) {
                            ctx.fillStyle = this.bZoneColor;
                            ctx.fillRect(-pw / 2 + leftZoneW, -ph / 2, pw - leftZoneW, ph);
                        }
                        ctx.restore();

                        ctx.lineWidth = full ? CARD_BORDER_DONE : CARD_BORDER;
                        ctx.strokeStyle = full ? '#43a047' : '#9fc9de';
                        roundRect(ctx, -pw / 2, -ph / 2, pw, ph, CARD_RADIUS);
                        ctx.stroke();

                        // 预先摆好的水果（加数a，静态展示，和后面要拖进来的b水果品种不同）
                        if (prefillN) {
                            ctx.fillStyle = '#000000'; //重置透明度
                            const itemDef = Config.itemTypes[container.prefillType];
                            for (let i = 0; i < prefillN; i++) {
                                const s = container.slots[i];
                                ctx.save();
                                ctx.translate(s.x, s.y);
                                if (itemDef && itemDef.draw) itemDef.draw(ctx, container.itemR);
                                ctx.restore();
                            }
                        }

                        // 还空着等待拖入的目标位置：用不透明的橙色圆环标出来（不是淡淡的色块）
                        ctx.lineWidth = 3;
                        ctx.strokeStyle = '#ffa726';
                        for (let i = container.items.length; i < container.capacity; i++) {
                            const s = container.slots[container.slotOffset + i];
                            ctx.beginPath();
                            ctx.arc(s.x, s.y, container.itemR * 0.5, 0, Math.PI * 2);
                            ctx.stroke();
                        }

                        ctx.restore();
                    },

                    // 下方文字："a + b = " 部分从始至终都是实色不透明；
                    // 只有 "c"（得数）在没完成时是半透明占位，完成后才变彩色、放大弹跳。
                    // 字号是其它关卡的2倍；如果太长放不下会按比例缩小避免溢出屏幕。
                    drawLabel(ctx, container) {
                        const full = container.items.length >= container.capacity;
                        const leftText = `${container.eqA} + ${container.eqB} = `;
                        const rightText = full ? String(container.eqSum) : '?';

                        ctx.save();
                        ctx.textBaseline = 'middle';
                        let fontSize = container.labelFontSize;
                        ctx.font = `bold ${fontSize}px sans-serif`;
                        let totalW = ctx.measureText(leftText).width + ctx.measureText(rightText).width;
                        if (totalW > container.maxLabelWidth) {
                            fontSize = Math.max(20, Math.floor(fontSize * container.maxLabelWidth / totalW));
                            ctx.font = `bold ${fontSize}px sans-serif`;
                            totalW = ctx.measureText(leftText).width + ctx.measureText(rightText).width;
                        }
                        const leftW = ctx.measureText(leftText).width;
                        const rightW = totalW - leftW;
                        const baseX = container.x - totalW / 2;
                        const baseY = container.labelY;

                        ctx.textAlign = 'left';
                        ctx.fillStyle = '#2b5876';
                        ctx.fillText(leftText, baseX, baseY);

                        ctx.save();
                        ctx.translate(baseX + leftW + rightW / 2, baseY);
                        ctx.scale(container.numberScale || 1, container.numberScale || 1);
                        ctx.textAlign = 'center';
                        if (full) {
                            ctx.lineWidth = 5;
                            ctx.strokeStyle = '#ffffff';
                            ctx.strokeText(rightText, 0, 0);
                            ctx.fillStyle = container.completeColor || '#43a047';
                        } else {
                            ctx.fillStyle = 'rgba(43,88,118,0.32)';
                        }
                        ctx.fillText(rightText, 0, 0);
                        ctx.restore();

                        ctx.restore();
                    }
                },

                // ---- subtractionRow：10以内减法 a－b＝c ----
                // 顶部：一整排 a 个同一种水果，用底色分成左边 c 个（保留区）+ 右边 b 个（将被拿走区）；
                // 中间：算式文字 "a－b＝?"；
                // 底部：居中的 b 个空格子，等着承接从顶部拖下来的那一组水果。
                // 顶部 b 区本身不画水果——那部分水果由一个可拖动的"整组卡片"表示，
                // 初始就摆在 b 区正上方（视觉上像是这一行本来的一部分），拖到底部格子后才算数。
                subtractionRow: {
                    cellSize: 56,
                    keepZoneColor: '#dff0f7',    // c：保留区，浅蓝底
                    removeZoneColor: '#ffe0b2',  // b：将被拿走区，浅橙底
                    targetZoneColor: '#ffe9c7',  // 底部承接格子，浅橙底（呼应上面要拿走的部分）
                    completeColors: ['#e57373', '#ffb74d', '#fdd85d', '#81c784', '#64b5f6', '#ba68c8', '#a1887f'],

                    // 顶部行按 a 个格子算宽度（a 是这一排里最多的格子数），
                    // 底部行只有 b 个格子，居中摆在顶部行下方；两行格子大小/间距完全一致
                    computeDims(cw, count, level) {
                        const cols = level.a;
                        const sideMargin = 20, outerGap = 24;
                        const maxAvailableW = (cw - sideMargin * 2 - outerGap * (count - 1)) / count;
                        const pitchByWidth = (maxAvailableW - (cols - 1) * 4) / cols;
                        const cell = Math.max(24, Math.min(this.cellSize, pitchByWidth));
                        const cellGap = Math.max(4, Math.round(cell * 0.15));

                        const topRowW = cols * cell + (cols - 1) * cellGap;
                        const bottomRowW = level.b * cell + Math.max(0, level.b - 1) * cellGap;
                        const width = Math.max(topRowW, bottomRowW);

                        const labelFontSize = Math.max(40, Math.min(64, Math.round(cw * 0.13)));
                        const rowGap = 18;           // 顶部行 与 算式文字 之间
                        const labelToBottomGap = 18; // 算式文字 与 底部格子 之间
                        const topRowH = cell, bottomRowH = cell, labelH = labelFontSize;
                        const height = topRowH + rowGap + labelH + labelToBottomGap + bottomRowH;

                        const topRowY = -height / 2 + topRowH / 2;
                        const labelYOffset = topRowY + topRowH / 2 + rowGap + labelH / 2;
                        const bottomRowY = height / 2 - bottomRowH / 2;

                        return {
                            width, height, gap: outerGap, labelFontSize, cell, cellGap,
                            cols, topRowW, bottomRowW, topRowY, bottomRowY, labelYOffset,
                            prefillCount: level.a, maxLabelWidth: cw - 40,
                            eqA: level.a, eqB: level.b, eqC: level.c,
                            // 松手判定区专门框住底部承接格子（而不是整个容器），
                            // 避免孩子没拖动就手指一点，因为顶部b区本来就在容器范围内而被误判成"已放好"
                            dropZone: { dx: 0, dy: bottomRowY, halfW: bottomRowW / 2, halfH: cell / 2 }
                        };
                    },

                    // 前 a 个位置排在顶部行（居中），之后 b 个位置排在底部行（各自居中）
                    slotLayout(n, dims) {
                        const { cell, cellGap, prefillCount: a, topRowW, bottomRowW, topRowY, bottomRowY } = dims;
                        const pitch = cell + cellGap;
                        const positions = [];
                        for (let i = 0; i < n; i++) {
                            if (i < a) {
                                positions.push({ x: -topRowW / 2 + cell / 2 + i * pitch, y: topRowY });
                            } else {
                                const j = i - a;
                                positions.push({ x: -bottomRowW / 2 + cell / 2 + j * pitch, y: bottomRowY });
                            }
                        }
                        return positions;
                    },

                    draw(ctx, container) {
                        const full = container.items.length >= container.capacity;
                        const a = container.eqA, c = container.eqC;
                        const cell = container.cell;
                        ctx.save();
                        ctx.translate(container.x, container.y);

                        // 顶部行：一整条连续底板，裁剪成 c(保留/浅蓝) + b(将被拿走/浅橙) 两块颜色
                        // 外框整体外扩 CARD_PAD，视觉尺寸和拖动滑块的白卡片保持一致；
                        // 颜色分界线仍对齐实际内容（水果）所在位置，只是外框边缘往外多包一圈
                        const topRowW = container.topRowW, topY = container.topRowY;
                        const pTopW = topRowW + CARD_PAD * 2, pRowH = cell + CARD_PAD * 2;
                        const cW = topRowW * c / a;
                        const leftZoneW = CARD_PAD + cW;
                        ctx.save();
                        roundRect(ctx, -pTopW / 2, topY - pRowH / 2, pTopW, pRowH, CARD_RADIUS);
                        ctx.clip();
                        ctx.fillStyle = this.keepZoneColor;
                        ctx.fillRect(-pTopW / 2, topY - pRowH / 2, leftZoneW, pRowH);
                        ctx.fillStyle = this.removeZoneColor;
                        ctx.fillRect(-pTopW / 2 + leftZoneW, topY - pRowH / 2, pTopW - leftZoneW, pRowH);
                        ctx.restore();
                        ctx.lineWidth = CARD_BORDER;
                        ctx.strokeStyle = '#9fc9de';
                        roundRect(ctx, -pTopW / 2, topY - pRowH / 2, pTopW, pRowH, CARD_RADIUS);
                        ctx.stroke();

                        // c 个保留的水果：从头到尾静态显示，不参与拖拽
                        const typeDef = Config.itemTypes[container.prefillType];
                        for (let i = 0; i < c; i++) {
                            const s = container.slots[i];
                            ctx.save();
                            ctx.translate(s.x, s.y);
                            if (typeDef && typeDef.draw) typeDef.draw(ctx, container.itemR);
                            ctx.restore();
                        }
                        // 注意：b 个待拿走的水果不在这里画——由 ItemManager.initSubtractGroup
                        // 生成的可拖动"整组卡片"来表示，初始位置正好盖在这个 b 区上方

                        // 底部行：b 个空格子，等待承接拖过来的水果（同样外扩 CARD_PAD）
                        const bottomRowW = container.bottomRowW, botY = container.bottomRowY;
                        const pBotW = bottomRowW + CARD_PAD * 2;
                        ctx.fillStyle = 'rgba(0,0,0,0.10)';
                        roundRect(ctx, -pBotW / 2, botY - pRowH / 2 + pRowH * 0.05, pBotW, pRowH, CARD_RADIUS);
                        ctx.fill();
                        ctx.fillStyle = this.targetZoneColor;
                        roundRect(ctx, -pBotW / 2, botY - pRowH / 2, pBotW, pRowH, CARD_RADIUS);
                        ctx.fill();
                        ctx.lineWidth = full ? CARD_BORDER_DONE : CARD_BORDER;
                        ctx.strokeStyle = full ? '#43a047' : '#9fc9de';
                        roundRect(ctx, -pBotW / 2, botY - pRowH / 2, pBotW, pRowH, CARD_RADIUS);
                        ctx.stroke();

                        // 还空着的格子：橙色圆环提示
                        ctx.lineWidth = 3;
                        ctx.strokeStyle = '#ffa726';
                        for (let i = container.items.length; i < container.capacity; i++) {
                            const s = container.slots[container.slotOffset + i];
                            ctx.beginPath();
                            ctx.arc(s.x, s.y, container.itemR * 0.5, 0, Math.PI * 2);
                            ctx.stroke();
                        }

                        ctx.restore();
                    },

                    // 下方文字 "a－b＝"部分从始至终不透明；"c"（得数）在没完成时是半透明占位，
                    // 完成后放大变色弹跳。位置在顶部行和底部行之间（不是容器最下方）。
                    drawLabel(ctx, container) {
                        const full = container.items.length >= container.capacity;
                        const leftText = `${container.eqA} － ${container.eqB} ＝ `;
                        const rightText = full ? String(container.eqC) : '?';

                        ctx.save();
                        ctx.textBaseline = 'middle';
                        let fontSize = container.labelFontSize;
                        ctx.font = `bold ${fontSize}px sans-serif`;
                        let totalW = ctx.measureText(leftText).width + ctx.measureText(rightText).width;
                        if (totalW > container.maxLabelWidth) {
                            fontSize = Math.max(20, Math.floor(fontSize * container.maxLabelWidth / totalW));
                            ctx.font = `bold ${fontSize}px sans-serif`;
                            totalW = ctx.measureText(leftText).width + ctx.measureText(rightText).width;
                        }
                        const leftW = ctx.measureText(leftText).width;
                        const rightW = totalW - leftW;
                        const baseX = container.x - totalW / 2;
                        const baseY = container.y + container.labelYOffset;

                        ctx.textAlign = 'left';
                        ctx.fillStyle = '#2b5876';
                        ctx.fillText(leftText, baseX, baseY);

                        ctx.save();
                        ctx.translate(baseX + leftW + rightW / 2, baseY);
                        ctx.scale(container.numberScale || 1, container.numberScale || 1);
                        ctx.textAlign = 'center';
                        if (full) {
                            ctx.lineWidth = 5;
                            ctx.strokeStyle = '#ffffff';
                            ctx.strokeText(rightText, 0, 0);
                            ctx.fillStyle = container.completeColor || '#43a047';
                        } else {
                            ctx.fillStyle = 'rgba(43,88,118,0.32)';
                        }
                        ctx.fillText(rightText, 0, 0);
                        ctx.restore();

                        ctx.restore();
                    }
                }
            },

            // 模式分组：用于开局的"选择模式"菜单，同一组内用"继续"按钮循环
            groups: [
                { id: 'digits', title: '认识 1-10', titleEn: 'Numbers 1-10' },
                { id: 'seq20', title: '认识 20 以内', titleEn: 'Up to 20' },
                { id: 'hundred', title: '认识 100 以内', titleEn: 'Up to 100' },
                { id: 'addition', title: '10以内加法', titleEn: 'Addition to 10' },
                { id: 'subtraction', title: '10以内减法', titleEn: 'Subtraction to 10' }
            ],

            levels: [
                { id: 1, group: 'digits', title: '认识 1 · 2', titleEn: 'Numbers 1 · 2', boxNumbers: [1, 2], itemType: 'apple', containerType: 'plate' },
                { id: 2, group: 'digits', title: '认识 3 · 4', titleEn: 'Numbers 3 · 4', boxNumbers: [3, 4], itemType: 'apple', containerType: 'plate' },
                { id: 3, group: 'digits', title: '认识 5 · 6', titleEn: 'Numbers 5 · 6', boxNumbers: [5, 6], itemType: 'apple', containerType: 'plate' },
                { id: 4, group: 'digits', title: '认识 7 · 8', titleEn: 'Numbers 7 · 8', boxNumbers: [7, 8], itemType: 'apple', containerType: 'plate' },
                { id: 5, group: 'digits', title: '认识 9 · 10', titleEn: 'Numbers 9 · 10', boxNumbers: [9, 10], itemType: 'apple', containerType: 'plate' },

                // ---- 以下是"认识20以内"分组：新架构的演示关卡 ----

                // 数数模式：屏幕上先摆好10个水果（代表已经会数的10个），
                // 数字从10开始，每点一个新水果就往后数一个，一直数到20
                {
                    id: 6, group: 'seq20', title: '数一数：10 到 20', titleEn: 'Count: 10 to 20',
                    boxNumbers: [10], labelStart: [11], prefillCount: [10],
                    itemType: 'apple', containerType: 'grid', gridCols: 5
                },

                // ---- count by X 到 20：一次点一"束"，数字一次跳 N ----
                {
                    id: 8, group: 'seq20', title: '1个1个数，数到20', titleEn: 'Count by 1s to 20',
                    boxNumbers: [20], labelStart: [1], bundleSize: 1,
                    itemType: 'apple', containerType: 'grid', gridCols: 5
                },
                {
                    id: 9, group: 'seq20', title: '2个2个数，数到20', titleEn: 'Count by 2s to 20',
                    boxNumbers: [20], labelStart: [1], bundleSize: 2,
                    itemType: 'apple', containerType: 'grid', gridCols: 5
                },
                {
                    id: 10, group: 'seq20', title: '5个5个数，数到20', titleEn: 'Count by 5s to 20',
                    boxNumbers: [20], labelStart: [1], bundleSize: 5,
                    itemType: 'apple', containerType: 'grid', gridCols: 5
                },
                {
                    id: 11, group: 'seq20', title: '10个10个数，数到20', titleEn: 'Count by 10s to 20',
                    boxNumbers: [20], labelStart: [1], bundleSize: 10,
                    itemType: 'apple', containerType: 'grid', gridCols: 5
                },

                // ---- count by X 到 100：一行10个，格子和水果会自动缩小以放得下 ----
                {
                    id: 15, group: 'hundred', title: '10个10个数，数到100', titleEn: 'Count by 10s to 100',
                    boxNumbers: [100], labelStart: [1], bundleSize: 10,
                    itemType: 'apple', containerType: 'grid', gridCols: 10
                },
                {
                    id: 12, group: 'hundred', title: '1个1个数，数到100', titleEn: 'Count by 1s to 100',
                    boxNumbers: [100], labelStart: [1], bundleSize: 1,
                    itemType: 'apple', containerType: 'grid', gridCols: 10
                },
                {
                    id: 13, group: 'hundred', title: '2个2个数，数到100', titleEn: 'Count by 2s to 100',
                    boxNumbers: [100], labelStart: [1], bundleSize: 2,
                    itemType: 'apple', containerType: 'grid', gridCols: 10
                },
                {
                    id: 14, group: 'hundred', title: '5个5个数，数到100', titleEn: 'Count by 5s to 100',
                    boxNumbers: [100], labelStart: [1], bundleSize: 5,
                    itemType: 'apple', containerType: 'grid', gridCols: 10
                }
            ]
        };

        // ---- 生成"10以内加法"关卡：得数 x 从 2 到 10，
        //      每个得数按 (x-1)+1、(x-2)+2 ... 1+(x-1) 的顺序练习所有拆法 ----
        // a = 已经摆好的部分（预填充），b = 需要拖水果进去补上的部分
        (function buildAdditionLevels() {
            let nextId = 900;
            for (let sum = 2; sum <= 10; sum++) {
                for (let a = sum - 1; a >= 1; a--) {
                    const b = sum - a;
                    Config.levels.push({
                        id: nextId++,
                        group: 'addition',
                        title: `${a}+${b}`,
                        titleEn: `${a} + ${b}`,
                        itemType: 'apple',
                        containerType: 'equationRow',
                        interaction: 'drag',
                        sum, a, b,
                        boxNumbers: [b],
                        prefillCount: [a]
                    });
                }
            }
        })();

        // ---- 生成"10以内减法"关卡：被减数 a 从 2 到 10 作为关卡分组，
        //      每个 a 内按 b 从 1 递增到 a-1 的顺序练习（c = a - b）----
        (function buildSubtractionLevels() {
            let nextId = 2000;
            for (let a = 2; a <= 10; a++) {
                for (let b = 1; b <= a - 1; b++) {
                    const c = a - b;
                    Config.levels.push({
                        id: nextId++,
                        group: 'subtraction',
                        title: `${a}－${b}`,
                        titleEn: `${a} - ${b}`,
                        itemType: 'apple',
                        containerType: 'subtractionRow',
                        interaction: 'drag',
                        a, b, c,
                        boxNumbers: [b],
                        prefillCount: [a]
                    });
                }
            }
        })();

        /* =========================================================
           Animation 模块
        ========================================================= */
        const Animation = {
            tweens: [],
            add(target, prop, from, to, duration, onDone) {
                this.tweens.push({ target, prop, from, to, duration, t: 0, onDone });
                target[prop] = from;
            },
            pulse(target, prop, base, peak, duration) {
                this.add(target, prop, base, peak, duration / 2, () => {
                    this.add(target, prop, peak, base, duration / 2, null);
                });
            },
            update(dt) {
                for (let i = this.tweens.length - 1; i >= 0; i--) {
                    const tw = this.tweens[i];
                    tw.t += dt;
                    const p = Math.min(1, tw.t / tw.duration);
                    const ease = 1 - Math.pow(1 - p, 3);
                    tw.target[tw.prop] = tw.from + (tw.to - tw.from) * ease;
                    if (p >= 1) {
                        this.tweens.splice(i, 1);
                        if (tw.onDone) tw.onDone();
                    }
                }
            }
        };

        // 放置水果时的发音策略：
        //   - 加减法算式行（equationRow / subtractionRow）：放置过程中不发音，只在整个算式完成时读一次完整算式
        //   - "数数"模式（labelMode === 'count'，比如11数到20、按束数到100）：每放一个/一束都读出当前数到几，念的就是数数过程
        //   - "认识数字"模式（比如认识3，盘子容量=3）：放置过程中不重复读同一个数字，只在盘子被放满的那一刻读一次目标数字
        function speakOnPlace(container) {
            if (container.type === 'equationRow' || container.type === 'subtractionRow') return;
            if (container.labelMode === 'count') {
                Sound.speakNumber(container.displayValue);
            } else if (container.items.length >= container.capacity) {
                Sound.speakNumber(container.value);
            }
        }

        /* =========================================================
           ContainerManager 模块
           —— 管理各种容器（盘子/方格条/...），不关心具体形状，
              只依赖 containerTypes 插件暴露的统一接口
        ========================================================= */
        const ContainerManager = {
            containers: [],
            scatterTop: 0,

            init(level, cw, topOffset, foodType, foodTypeB) {
                this.containers = [];
                const typeDef = Config.containerTypes[level.containerType];
                const count = level.boxNumbers.length;
                const dims = typeDef.computeDims(cw, count, level);
                const { width, height, gap, labelFontSize } = dims;

                // 水果图标大小：plate（认识数字1-10）固定20不变；
                // grid / equationRow 格子如果因为列数多、屏幕窄而被压小了（比如一行10个），
                // 图标跟着适当缩小，但优先保证孩子手指点得到——
                // 允许图标比格子略大、稍微拥挤，也不要缩得太小
                const cellBased = (level.containerType === 'grid' || level.containerType === 'equationRow' || level.containerType === 'subtractionRow') && dims.cell;
                Config.itemRadius = cellBased
                    ? Math.max(15, Math.min(23, dims.cell * 0.62)) * (dims.cols >= 10 ? 0.9 : 1)
                    : 20;

                const totalW = width * count + gap * (count - 1);
                const centerY = topOffset + height / 2;
                const labelGap = 18;
                const labelY = centerY + height / 2 + labelGap + labelFontSize * 0.5;
                let curX = (cw - totalW) / 2;

                level.boxNumbers.forEach((value, i) => {
                    const x = curX + width / 2;
                    // 预填充的格子（已经会数的部分，静态展示），互动格子（value 个，需要玩家放）
                    const prefillCount = (level.prefillCount && level.prefillCount[i]) || 0;
                    const totalCells = value + prefillCount;
                    const slots = typeDef.slotLayout(totalCells, dims);
                    const container = Object.assign({
                        id: 'c' + i,
                        type: level.containerType,
                        value,
                        capacity: value,
                        prefillCount,
                        slotOffset: prefillCount,
                        prefillType: foodType,
                        targetType: foodTypeB || foodType,
                        items: [],
                        x, y: centerY,
                        width, height,
                        itemR: Config.itemRadius,
                        slots,
                        labelY,
                        labelFontSize,
                        numberScale: 1,
                        completeColor: null
                    }, dims);

                    // 数数模式：数字从 labelStart 开始，随每次放入递增（比如从11数到20）
                    // 而不是像"认识数字"那样恒定显示目标值
                    if (level.labelStart) {
                        container.labelMode = 'count';
                        container.labelStart = level.labelStart[i];
                        container.idleColor = level.idleColor || '#4a90c4';
                        container.displayValue = container.labelStart - 1;
                    }

                    this.containers.push(container);
                    curX += width + gap;
                });

                this.scatterTop = labelY + labelFontSize * 0.6 + 24;
            },

            slotPosition(container, index) {
                const s = container.slots[container.slotOffset + index];
                return { x: container.x + s.x, y: container.y + s.y };
            },

            findAvailableContainer() {
                return this.containers.find(c => c.items.length < c.capacity) || null;
            },

            tryPlace(container, item) {
                if (container.items.length >= container.capacity) return false;
                container.items.push(item);
                if (container.labelMode === 'count') {
                    container.displayValue = container.labelStart - 1 + container.items.length;
                }
                const nowFull = container.items.length >= container.capacity;
                if (nowFull) {
                    const palette = Config.containerTypes[container.type].completeColors;
                    container.completeColor = palette[Math.floor(Math.random() * palette.length)];
                    Animation.pulse(container, 'numberScale', 1, 1.6, 420);
                } else {
                    Animation.pulse(container, 'numberScale', 1, 1.12, 220);
                }
                speakOnPlace(container);
                return true;
            },

            // 一次性放入一整束（N个计数单位）：一次点击、数字一次跳N。
            // 逻辑上和 tryPlace 相同（占位/更新数字/判断完成），只是一次占 N 个格子而不是1个。
            // 立刻创建 N 个"已放置"的子水果对象占住格子（初始都堆在束的原始位置，
            // 后续由 ItemManager.moveBundleToSlots 把它们分别飞到各自的格子）。
            tryPlaceBundle(container, bundleToken) {
                const n = bundleToken.unitCount || 1;
                if (container.items.length + n > container.capacity) return null;
                const startIndex = container.items.length;
                const subItems = [];
                for (let k = 0; k < n; k++) {
                    const sub = {
                        id: bundleToken.id + '_' + k,
                        type: bundleToken.type,
                        r: Config.itemRadius,
                        x: bundleToken.x, y: bundleToken.y,
                        homeX: bundleToken.x, homeY: bundleToken.y,
                        boxed: true,
                        dragging: false,
                        scale: 0.4
                    };
                    container.items.push(sub);
                    subItems.push(sub);
                }
                if (container.labelMode === 'count') {
                    container.displayValue = container.labelStart - 1 + container.items.length;
                }
                const nowFull = container.items.length >= container.capacity;
                if (nowFull) {
                    const palette = Config.containerTypes[container.type].completeColors;
                    container.completeColor = palette[Math.floor(Math.random() * palette.length)];
                    Animation.pulse(container, 'numberScale', 1, 1.6, 420);
                } else {
                    Animation.pulse(container, 'numberScale', 1, 1.12, 220);
                }
                speakOnPlace(container);
                return { startIndex, subItems };
            },

            // 加法关卡专用：把拖过来的"一整组"水果（b个）一次性放进目标区。
            // 每个子水果的起始位置按组内实际的排布算出来（和主行格子同样的间距），
            // 这样落位动画只是"轻轻对齐"一下，不会有明显的跳动。
            tryPlaceGroup(container, group) {
                const n = group.count;
                if (container.items.length + n > container.capacity) return null;
                const startIndex = container.items.length;
                const pitch = group.cell + group.cellGap;
                const groupW = n * group.cell + (n - 1) * group.cellGap;
                const subItems = [];
                for (let k = 0; k < n; k++) {
                    const sx = group.x - groupW / 2 + group.cell / 2 + k * pitch;
                    const sub = {
                        id: group.id + '_' + k,
                        type: group.type,
                        r: container.itemR,
                        x: sx, y: group.y,
                        homeX: sx, homeY: group.y,
                        boxed: true,
                        dragging: false,
                        scale: 1
                    };
                    container.items.push(sub);
                    subItems.push(sub);
                }
                const nowFull = container.items.length >= container.capacity;
                if (nowFull) {
                    const palette = Config.containerTypes[container.type].completeColors;
                    container.completeColor = palette[Math.floor(Math.random() * palette.length)];
                    Animation.pulse(container, 'numberScale', 1, 1.6, 420);
                } else {
                    Animation.pulse(container, 'numberScale', 1, 1.12, 220);
                }
                // 加法拖组：放置过程中不发音，完成后统一在 showComplete 里读整个算式
                return { startIndex, subItems };
            },

            isAllComplete() {
                return this.containers.every(c => c.items.length === c.capacity);
            }
        };

        /* =========================================================
           ItemManager 模块
           —— 新增 WaveSpawner 能力：数量很大时不会一次性把屏幕铺满，
              每次最多同时出现 batchSize 个（默认20），点完/放完当前这批，
              才会自动补出下一批。数量少的关卡（<= batchSize）行为和以前完全一样。
        ========================================================= */
        const ItemManager = {
            items: [],
            moveLock: false,
            cw: 0, ch: 0, scatterTop: 0, foodType: 'apple',
            totalNeeded: 0,
            spawnedTotal: 0,
            batchSize: 20,
            bundleSize: 1,

            init(level, cw, ch, scatterTop, foodType) {
                this.items = [];
                this.moveLock = false;
                this.cw = cw; this.ch = ch; this.scatterTop = scatterTop; this.foodType = foodType;

                // 加法/减法关卡（拖拽交互）：b 个水果当成"一整组"一起出现，不走 WaveSpawner 那一套
                if (level.interaction === 'drag') {
                    if (level.containerType === 'subtractionRow') {
                        this.initSubtractGroup(level, foodType);
                    } else {
                        this.initAddendGroup(level, foodType);
                    }
                    return;
                }

                this.bundleSize = level.bundleSize || 1;
                // count by N 的关卡里，totalNeeded 数的是"要点几次/几个 token"，
                // 不是水果的总数量（比如 20 个水果、每次点2个 = 只需要10个 token）
                const totalUnits = level.boxNumbers.reduce((a, b) => a + b, 0);
                this.totalNeeded = Math.ceil(totalUnits / this.bundleSize);
                this.spawnedTotal = 0;
                this.batchSize = level.batchSize || 20;
                this.spawnWave();
            },

            // 生成加法关卡里那"一整组"待拖入的水果：大小、间距和目标行的格子完全一致，
            // 这样拖动时看起来就像是要把这一截"接"到主行上，而不是零散地一个个放
            initAddendGroup(level, foodType) {
                const container = ContainerManager.containers[0];
                const n = level.b;
                const cell = container.cell, cellGap = container.cellGap;
                const groupW = n * cell + (n - 1) * cellGap;
                const groupH = cell;

                const marginX = groupW / 2 + 20;
                const marginY = groupH / 2 + 20;
                const areaTop = this.scatterTop + marginY;
                const areaBottom = this.ch - marginY;
                const xLo = Math.min(marginX, this.cw - marginX);
                const xHi = Math.max(marginX, this.cw - marginX);
                const yLo = Math.min(areaTop, areaBottom);
                const yHi = Math.max(areaTop, areaBottom);
                const x = rand(xLo, xHi);
                const y = rand(yLo, yHi);

                this.items = [{
                    id: 'addendGroup',
                    isGroup: true,
                    type: foodType,
                    count: n,
                    cell, cellGap,
                    r: container.itemR,
                    x, y,
                    homeX: x, homeY: y,
                    boxed: false,
                    dragging: false,
                    scale: 1
                }];
                this.totalNeeded = n;
                this.spawnedTotal = n;
            },

            // 生成减法关卡里那"一整组"待拖走的水果：初始位置正好摆在顶部行的 b 区（要拿走的那一段）上方，
            // 大小、间距和顶部行的格子完全一致，看起来就像是从这一排里把最后 b 个"拎"出来，
            // 拖到下方 a－b＝? 算式下面的目标格子里
            initSubtractGroup(level, foodType) {
                const container = ContainerManager.containers[0];
                const n = level.b;
                const c = level.c;
                const cell = container.cell, cellGap = container.cellGap;

                // b 区（顶部行里 c 之后的 b 个格子）在容器坐标系里的中心位置
                const bSlots = container.slots.slice(c, c + n);
                const relX = bSlots.reduce((s, sl) => s + sl.x, 0) / n;
                const relY = bSlots.reduce((s, sl) => s + sl.y, 0) / n;
                const x = container.x + relX;
                const y = container.y + relY;

                this.items = [{
                    id: 'subtractGroup',
                    isGroup: true,
                    type: foodType,
                    count: n,
                    cell, cellGap,
                    r: container.itemR,
                    x, y,
                    homeX: x, homeY: y,
                    boxed: false,
                    dragging: false,
                    scale: 1
                }];
                this.totalNeeded = n;
                this.spawnedTotal = n;
            },

            // 一个 token 的"点击判定半径"：单个水果就是 Config.itemRadius；
            // 水果束（bundleSize>1）用统一的 bundleRadius()，保证点击范围足够大、好点
            tokenRadius() {
                return this.bundleSize > 1 ? bundleRadius(this.bundleSize) : Config.itemRadius;
            },

            // 一个 token 排布时真正占用的宽高（用于计算屏幕上能摆几行几列）。
            // 水果束卡片往往是"宽而扁"的（比如5个一组是一整排），如果排布时
            // 也按（宽/高中较大的那个）当正方形来占地，会白白浪费很多空间，
            // 导致明明卡片不高、其实能多摆几排，却被误判成放不下。
            // 所以这里分别用卡片的真实宽度和高度，卡片本身大小完全不受影响。
            tokenFootprint() {
                if (this.bundleSize > 1) {
                    const L = bundleLayout(this.bundleSize);
                    return { w: L.cardW, h: L.cardH };
                }
                const d = Config.itemRadius * 2;
                return { w: d, h: d };
            },

            // 生成一批新 token：用"网格+轻微抖动"摆放，而不是纯随机撒点。
            // 之前用纯随机+失败兜底的方式，兜底逻辑没检查是否会和已有物品重叠，
            // 一旦随机撒点失败（大水果束、位置紧张时很容易失败），就会把新物品几乎
            // 摞在已有物品正上方，导致下面那个被完全挡住、点不到——这是之前的bug。
            // 现在改成：先按当前可视区域能摆下几行几列算出网格，再在每个格子中心
            // 加一点抖动，保证不重叠、不出屏幕；这一批放不下的数量会自动留到下一批。
            spawnWave() {
                const remaining = this.totalNeeded - this.spawnedTotal;
                if (remaining <= 0) return;

                const r = this.tokenRadius();
                const fp = this.tokenFootprint();
                const pad = 10;
                const spacingX = fp.w + pad, spacingY = fp.h + pad;
                const marginX = fp.w / 2 + pad, marginY = fp.h / 2 + pad;
                const areaW = this.cw - marginX * 2;
                const areaH = (this.ch - marginY) - (this.scatterTop + marginY);
                const cols = Math.max(1, Math.floor(areaW / spacingX));
                const rows = Math.max(1, Math.floor(areaH / spacingY));
                const areaCapacity = cols * rows;

                // 这一批最多只生成"当前屏幕真正放得下"的数量，避免物品被挤没了
                const waveCount = Math.min(this.batchSize, remaining, areaCapacity);

                // 已经在屏幕上但还没被拿走的 token，占用对应的网格格子，新的要避开
                const usedCells = new Set();
                this.items.filter(it => !it.boxed).forEach(it => {
                    const col = Math.round((it.x - marginX - spacingX / 2) / spacingX);
                    const rowIdx = Math.round((it.y - (this.scatterTop + marginY) - spacingY / 2) / spacingY);
                    usedCells.add(rowIdx * cols + col);
                });

                let placed = 0;
                for (let cell = 0; cell < cols * rows && placed < waveCount; cell++) {
                    if (usedCells.has(cell)) continue;
                    const col = cell % cols;
                    const rowIdx = Math.floor(cell / cols);
                    const jitterX = spacingX * 0.12, jitterY = spacingY * 0.12;
                    const x = marginX + col * spacingX + spacingX / 2 + rand(-jitterX, jitterX);
                    const y = this.scatterTop + marginY + rowIdx * spacingY + spacingY / 2 + rand(-jitterY, jitterY);

                    this.items.push({
                        id: 'item' + this.spawnedTotal,
                        type: this.foodType,
                        unitCount: this.bundleSize,
                        r,
                        x, y,
                        homeX: x, homeY: y,
                        boxed: false,
                        dragging: false,
                        scale: 1
                    });
                    this.spawnedTotal++;
                    placed++;
                }
            },

            // 每次成功放入后调用：如果当前这批已经全部被放走、
            // 且还有没生成的 token，就自动补下一批
            maybeSpawnNextWave() {
                if (this.totalNeeded - this.spawnedTotal <= 0) return;
                const liveUnboxed = this.items.some(it => !it.boxed);
                if (!liveUnboxed) this.spawnWave();
            },

            itemAt(x, y) {
                for (let i = this.items.length - 1; i >= 0; i--) {
                    const it = this.items[i];
                    if (it.boxed || it.dragging) continue;
                    if (it.isGroup) {
                        const w = it.count * it.cell + (it.count - 1) * it.cellGap + 20;
                        const h = it.cell + 20;
                        if (Math.abs(x - it.x) <= w / 2 && Math.abs(y - it.y) <= h / 2) return it;
                    } else if (dist(x, y, it.x, it.y) <= it.r * 1.5) {
                        return it;
                    }
                }
                return null;
            },

            moveToBoxSlot(item, container, slot, onDone) {
                item.boxed = true;
                let completed = 0;
                const tryDone = () => { completed++; if (completed >= 2 && onDone) onDone(); };
                Animation.add(item, 'x', item.x, slot.x, 240, tryDone);
                Animation.add(item, 'y', item.y, slot.y, 240, tryDone);
                Animation.add(item, 'scale', 1, 1.35, 120, () => {
                    Animation.add(item, 'scale', 1.35, 1, 120, null);
                });
            },

            // 水果束落位动画：原 token 缩小消失，同时"炸开"成 N 个小水果，
            // 各自飞向自己的格子。全部动画完成后才调用 onDone。
            moveBundleToSlots(bundleToken, container, startIndex, subItems, onDone) {
                bundleToken.boxed = true;
                let pending = 0;
                const done = () => { pending--; if (pending <= 0 && onDone) onDone(); };

                pending++;
                Animation.add(bundleToken, 'scale', 1, 0, 200, done);

                subItems.forEach((sub, k) => {
                    this.items.push(sub);
                    const slot = ContainerManager.slotPosition(container, startIndex + k);
                    pending += 3;
                    Animation.add(sub, 'x', sub.x, slot.x, 260, done);
                    Animation.add(sub, 'y', sub.y, slot.y, 260, done);
                    Animation.add(sub, 'scale', 0.4, 1, 260, done);
                });
            },

            // 加法关卡"整组拖入"落位动画：去掉原来的整组 token，换成 n 个独立小水果，
            // 因为大小间距在生成时就已经和目标行对齐了，这里只是轻轻对齐滑入各自的格子
            moveGroupToSlots(group, container, startIndex, subItems, onDone) {
                const idx = this.items.indexOf(group);
                if (idx !== -1) this.items.splice(idx, 1);

                if (subItems.length === 0) { if (onDone) onDone(); return; }
                let pending = 0;
                const done = () => { pending--; if (pending <= 0 && onDone) onDone(); };

                subItems.forEach((sub, k) => {
                    this.items.push(sub);
                    const slot = ContainerManager.slotPosition(container, startIndex + k);
                    pending += 2;
                    Animation.add(sub, 'x', sub.x, slot.x, 220, done);
                    Animation.add(sub, 'y', sub.y, slot.y, 220, done);
                });
            }
        };

        /* =========================================================
           LevelManager 模块
           —— 关卡按 group 分组（比如"认识1-10" / "认识20以内"），
              进入某个模式后，"继续"按钮只在该组内循环，不会跨组
        ========================================================= */
        const LevelManager = {
            currentGroup: null,
            groupLevels: [],
            indexInGroup: 0,
            currentFoodType: 'apple',

            randomFoodType() {
                const keys = Config.foodTypeKeys;
                return keys[Math.floor(Math.random() * keys.length)];
            },

            // 加法关卡用：a 和 b 两部分水果品种不同，随机挑两个不重复的
            randomFoodTypePair() {
                const keys = Config.foodTypeKeys;
                const a = keys[Math.floor(Math.random() * keys.length)];
                let b = a;
                while (b === a) b = keys[Math.floor(Math.random() * keys.length)];
                return [a, b];
            },

            levelsInGroup(groupId) {
                return Config.levels.filter(l => l.group === groupId);
            },

            // 选关下拉菜单要显示的条目：大多数分组直接列出每一关；
            // "10以内加法"关卡太多（45关），改成只列 9 个"和为X"，点击后跳到 (x-1)+1 的第一个拆法
            menuEntries() {
                if (this.currentGroup === 'addition') {
                    const seen = new Set();
                    const entries = [];
                    this.groupLevels.forEach((lv, i) => {
                        if (!seen.has(lv.sum)) {
                            seen.add(lv.sum);
                            entries.push({ index: i, title: isEnglish ? `Sum = ${lv.sum}` : `和为 ${lv.sum}`, sum: lv.sum });
                        }
                    });
                    return entries;
                }
                // "10以内减法"关卡也很多（45关），改成只列 9 个"被减数为X"，点击后跳到 b=1 的第一个拆法
                if (this.currentGroup === 'subtraction') {
                    const seen = new Set();
                    const entries = [];
                    this.groupLevels.forEach((lv, i) => {
                        if (!seen.has(lv.a)) {
                            seen.add(lv.a);
                            entries.push({ index: i, title: isEnglish ? `Minuend = ${lv.a}` : `被减数为 ${lv.a}`, a: lv.a });
                        }
                    });
                    return entries;
                }
                return this.groupLevels.map((lv, i) => ({ index: i, title: levelTitle(lv) }));
            },

            // 判断下拉菜单里的某一项是否对应当前关卡
            // （加法按"和"匹配，减法按"被减数"匹配，其它分组按精确 index 匹配）
            isMenuEntryCurrent(entry) {
                if (this.currentGroup === 'addition') {
                    return this.currentLevel().sum === entry.sum;
                }
                if (this.currentGroup === 'subtraction') {
                    return this.currentLevel().a === entry.a;
                }
                return entry.index === this.indexInGroup;
            },

            // 从菜单进入某个模式，从该组第一关开始
            startGroup(cw, ch, groupId) {
                this.currentGroup = groupId;
                this.groupLevels = this.levelsInGroup(groupId);
                this.indexInGroup = 0;
                this.loadCurrent(cw, ch);
            },

            loadCurrent(cw, ch) {
                const level = this.groupLevels[this.indexInGroup];
                const topOffset = ch * 0.05 + 30;

                if (level.interaction === 'drag' && level.containerType === 'subtractionRow') {
                    // 减法：被减去的所有水果都是同一种，只随机挑一种水果类型
                    const food = this.randomFoodType();
                    this.currentFoodType = food;
                    ContainerManager.init(level, cw, topOffset, food, food);
                    ItemManager.init(level, cw, ch, ContainerManager.scatterTop, food);
                } else if (level.interaction === 'drag') {
                    // 加数(a，已摆好)和被拖入的数(b)用两种不同的水果，方便孩子分清"原来有的"和"要加的"
                    const [foodA, foodB] = this.randomFoodTypePair();
                    this.currentFoodType = foodA;
                    ContainerManager.init(level, cw, topOffset, foodA, foodB);
                    ItemManager.init(level, cw, ch, ContainerManager.scatterTop, foodB);
                } else {
                    this.currentFoodType = this.randomFoodType();
                    ContainerManager.init(level, cw, topOffset, this.currentFoodType);
                    ItemManager.init(level, cw, ch, ContainerManager.scatterTop, this.currentFoodType);
                }
                UI.reset();
            },

            currentLevel() { return this.groupLevels[this.indexInGroup]; },
            reloadCurrent(cw, ch) { this.loadCurrent(cw, ch); },
            nextLevel(cw, ch) {
                this.indexInGroup = (this.indexInGroup + 1) % this.groupLevels.length;
                this.loadCurrent(cw, ch);
            },
            // 家长用的"选关"菜单：直接跳到该组内任意一关
            goToLevel(cw, ch, index) {
                if (index < 0 || index >= this.groupLevels.length) return;
                this.indexInGroup = index;
                this.loadCurrent(cw, ch);
            }
        };

        /* =========================================================
           UI 模块
        ========================================================= */
        const UI = {
            complete: false,
            celebrateScale: 1,
            continueBtn: null,
            continueVisible: false,
            continueTimer: null,
            menuButtons: [],
            backBtn: null,
            levelMenuOpen: false,
            levelMenuItems: [],
            levelMenuBox: null,
            titleArrowBtn: null,

            reset() {
                this.complete = false;
                this.continueVisible = false;
                this.levelMenuOpen = false;
                if (this.continueTimer) { clearTimeout(this.continueTimer); this.continueTimer = null; }
            },

            // ---- 开局的"选择模式"菜单 ----
            layoutMenu(cw, ch) {
                const btnW = Math.min(240, cw - 70);
                const btnH = 58;
                const gap = 16;
                const groups = Config.groups;
                const totalH = groups.length * btnH + (groups.length - 1) * gap;
                let y = ch / 2 - totalH / 2;
                this.menuButtons = groups.map(g => {
                    const btn = { id: g.id, title: groupTitle(g), x: cw / 2 - btnW / 2, y, w: btnW, h: btnH };
                    y += btnH + gap;
                    return btn;
                });
            },

            drawMenu(ctx, cw, ch) {
                ctx.save();
                ctx.fillStyle = '#eaf7ff';
                ctx.fillRect(0, 0, cw, ch);
                ctx.font = 'bold 22px sans-serif';
                ctx.fillStyle = '#2b5876';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(t('selectMode'), cw / 2, this.menuButtons[0] ? this.menuButtons[0].y - 46 : ch / 2 - 100);

                this.menuButtons.forEach(b => {
                    ctx.fillStyle = '#6fae6a';
                    roundRect(ctx, b.x, b.y, b.w, b.h, 18);
                    ctx.fill();
                    ctx.font = 'bold 19px sans-serif';
                    ctx.fillStyle = '#fff';
