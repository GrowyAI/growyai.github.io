                    ctx.fillText(b.title, b.x + b.w / 2, b.y + b.h / 2);
                });
                ctx.restore();
            },

            hitMenu(x, y) {
                const b = this.menuButtons.find(btn => x > btn.x && x < btn.x + btn.w && y > btn.y && y < btn.y + btn.h);
                return b ? b.id : null;
            },

            // ---- 游戏中左上角的"返回菜单"按钮 ----
            layoutBackButton() {
                this.backBtn = { x: 12, y: 8, w: 64, h: 32 };
            },

            drawBackButton(ctx) {
                const b = this.backBtn;
                ctx.save();
                ctx.fillStyle = 'rgba(43,88,118,0.15)';
                roundRect(ctx, b.x, b.y, b.w, b.h, 10);
                ctx.fill();
                ctx.font = 'bold 15px sans-serif';
                ctx.fillStyle = '#2b5876';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(t('menu'), b.x + b.w / 2, b.y + b.h / 2 + 1);
                ctx.restore();
            },

            hitBack(x, y) {
                const b = this.backBtn;
                if (!b) return false;
                return x > b.x && x < b.x + b.w && y > b.y && y < b.y + b.h;
            },

            showComplete(cw, ch) {
                this.complete = true;
                this.continueVisible = false;
                // 底部居中的"继续"按钮，留出安全边距
                this.continueBtn = { x: cw / 2 - 78, y: ch - 52 - 32, w: 156, h: 52 };

                // 🔊 关卡完成：只有加/减法关卡在这里读一次完整算式；
                // 数数类关卡（11-20、按束数到100等）在放置过程中已经逐个数过了，这里不重复播报
                const level = LevelManager.currentLevel();
                if (level.containerType === 'equationRow') {
                    Sound.speakFormula(level.a, '+', level.b, level.sum);
                } else if (level.containerType === 'subtractionRow') {
                    Sound.speakFormula(level.a, '-', level.b, level.c);
                }

                // 过2秒再显示按钮，方便先看清后面数一数的画面
                if (this.continueTimer) clearTimeout(this.continueTimer);
                this.continueTimer = setTimeout(() => {
                    this.continueVisible = true;
                    this.celebrateScale = 0.5;
                    Animation.add(this, 'celebrateScale', 0.5, 1, 380, null);
                }, 1000);
            },

            drawTitle(ctx, cw) {
                const level = LevelManager.currentLevel();
                ctx.save();
                ctx.font = 'bold 22px sans-serif';
                ctx.fillStyle = '#2b5876';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillText(levelTitle(level), cw / 2, 10);

                // 标题右侧一个低调的小箭头，供家长展开"选关"菜单（触控区域比图形本身大一些）
                const textW = ctx.measureText(levelTitle(level)).width;
                const arrowCx = cw / 2 + textW / 2 + 18;
                const arrowCy = 10 + 11;
                this.titleArrowBtn = { x: arrowCx - 16, y: 2, w: 32, h: 28 };
                ctx.fillStyle = this.levelMenuOpen ? '#2b5876' : 'rgba(43,88,118,0.45)';
                ctx.beginPath();
                if (this.levelMenuOpen) {
                    // 展开时箭头朝上
                    ctx.moveTo(arrowCx - 6, arrowCy + 3);
                    ctx.lineTo(arrowCx + 6, arrowCy + 3);
                    ctx.lineTo(arrowCx, arrowCy - 4);
                } else {
                    ctx.moveTo(arrowCx - 6, arrowCy - 3);
                    ctx.lineTo(arrowCx + 6, arrowCy - 3);
                    ctx.lineTo(arrowCx, arrowCy + 4);
                }
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            },

            // ---- 选关下拉菜单（低调，主要给家长用）----
            layoutLevelMenu(cw) {
                const entries = LevelManager.menuEntries();
                const rowH = 38;
                const menuW = Math.min(230, cw - 40);
                const top = 44;
                this.levelMenuItems = entries.map((entry, i) => ({
                    index: entry.index,
                    x: cw / 2 - menuW / 2,
                    y: top + i * rowH,
                    w: menuW,
                    h: rowH,
                    title: entry.title,
                    isCurrent: LevelManager.isMenuEntryCurrent(entry)
                }));
                this.levelMenuBox = { x: cw / 2 - menuW / 2, y: top, w: menuW, h: rowH * entries.length };
            },

            drawLevelMenu(ctx, cw) {
                if (!this.levelMenuOpen) return;
                const box = this.levelMenuBox;
                ctx.save();
                ctx.fillStyle = 'rgba(0,0,0,0.35)';
                ctx.fillRect(0, box.y, cw, 4000);
                ctx.fillStyle = '#ffffff';
                roundRect(ctx, box.x, box.y, box.w, box.h, 14);
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#cfe8f5';
                ctx.stroke();

                this.levelMenuItems.forEach((it, i) => {
                    const isCur = it.isCurrent;
                    if (isCur) {
                        ctx.fillStyle = 'rgba(111,174,106,0.14)';
                        roundRect(ctx, it.x + 4, it.y + 3, it.w - 8, it.h - 6, 10);
                        ctx.fill();
                    }
                    ctx.font = isCur ? 'bold 16px sans-serif' : '15px sans-serif';
                    ctx.fillStyle = isCur ? '#6fae6a' : '#2b5876';
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(it.title, it.x + 16, it.y + it.h / 2 + 1);
                    if (i < this.levelMenuItems.length - 1) {
                        ctx.strokeStyle = '#eef4f7';
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(it.x + 12, it.y + it.h);
                        ctx.lineTo(it.x + it.w - 12, it.y + it.h);
                        ctx.stroke();
                    }
                });
                ctx.restore();
            },

            hitTitleArrow(x, y) {
                const b = this.titleArrowBtn;
                if (!b) return false;
                return x > b.x && x < b.x + b.w && y > b.y && y < b.y + b.h;
            },

            // 返回点中的关卡 index；点在菜单框外则返回 'outside'；都没点中返回 null
            hitLevelMenu(x, y) {
                if (!this.levelMenuOpen) return null;
                const item = this.levelMenuItems.find(it => x > it.x && x < it.x + it.w && y > it.y && y < it.y + it.h);
                if (item) return item.index;
                const box = this.levelMenuBox;
                if (box && x > box.x && x < box.x + box.w && y > box.y && y < box.y + box.h) return null;
                return 'outside';
            },

            // 只保留一个"继续"按钮，去掉庆祝表情、文字和遮罩，避免挡住后面的数字画面
            // 按钮延迟1秒后才出现（continueVisible 由 showComplete 里的定时器控制）
            drawComplete(ctx, cw, ch) {
                if (!this.continueVisible) return;

                const b = this.continueBtn;
                ctx.save();
                ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
                ctx.scale(this.celebrateScale, this.celebrateScale);
                ctx.fillStyle = '#6fae6a';
                roundRect(ctx, -b.w / 2, -b.h / 2, b.w, b.h, 26);
                ctx.fill();
                ctx.font = 'bold 21px sans-serif';
                ctx.fillStyle = '#fff';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(t('continueBtn'), 0, 0);
                ctx.restore();
            },

            hitContinue(x, y) {
                if (!this.continueVisible) return false;
                const b = this.continueBtn;
                if (!b) return false;
                return x > b.x && x < b.x + b.w && y > b.y && y < b.y + b.h;
            }
        };

        /* =========================================================
           Renderer 模块
        ========================================================= */
        const Renderer = {
            ctx: null,
            canvas: null,

            init(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
            },

            render(cw, ch) {
                const ctx = this.ctx;
                ctx.clearRect(0, 0, cw, ch);

                if (Game.mode === 'menu') {
                    UI.drawMenu(ctx, cw, ch);
                    return;
                }

                ctx.fillStyle = '#eaf7ff';
                ctx.fillRect(0, 0, cw, ch);

                UI.drawTitle(ctx, cw);
                UI.drawBackButton(ctx);

                ContainerManager.containers.forEach(c => Config.containerTypes[c.type].draw(ctx, c));

                ItemManager.items.forEach(item => {
                    ctx.save();
                    ctx.translate(item.x, item.y);
                    ctx.scale(item.scale, item.scale);
                    if (item.isGroup) {
                        drawAddendGroup(ctx, item);
                    } else if (item.unitCount && item.unitCount > 1) {
                        drawBundleToken(ctx, item);
                    } else {
                        const typeDef = Config.itemTypes[item.type];
                        if (typeDef && typeDef.draw) typeDef.draw(ctx, item.r);
                    }
                    ctx.restore();
                });

                ContainerManager.containers.forEach(c => Config.containerTypes[c.type].drawLabel(ctx, c));

                if (UI.complete) UI.drawComplete(ctx, cw, ch);
                UI.drawLevelMenu(ctx, cw);
            }
        };

        /* =========================================================
           Input 模块
        ========================================================= */
        const Input = {
            bind(canvas, getSize) {
                let dragItem = null, dragDX = 0, dragDY = 0;

                const toLocal = (e) => {
                    const rect = canvas.getBoundingClientRect();
                    const touch = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]);
                    const p = touch || e;
                    return { x: p.clientX - rect.left, y: p.clientY - rect.top };
                };

                const down = (e) => {
                    e.preventDefault();
                    const { x, y } = toLocal(e);
                    const { cw, ch } = getSize();

                    if (Game.mode === 'menu') {
                        const groupId = UI.hitMenu(x, y);
                        if (groupId) {
                            Game.mode = 'playing';
                            LevelManager.startGroup(cw, ch, groupId);
                        }
                        return;
                    }

                    // 选关下拉菜单打开时，优先处理菜单内的点击
                    if (UI.levelMenuOpen) {
                        const hit = UI.hitLevelMenu(x, y);
                        UI.levelMenuOpen = false;
                        if (typeof hit === 'number') {
                            dragItem = null;
                            LevelManager.goToLevel(cw, ch, hit);
                        }
                        return;
                    }

                    if (UI.hitTitleArrow(x, y)) {
                        UI.layoutLevelMenu(cw);
                        UI.levelMenuOpen = true;
                        return;
                    }

                    if (UI.hitBack(x, y)) {
                        dragItem = null;
                        Game.mode = 'menu';
                        UI.reset();
                        return;
                    }

                    if (UI.complete) {
                        if (UI.hitContinue(x, y)) {
                            dragItem = null;
                            UI.complete = false;
                            LevelManager.nextLevel(cw, ch);
                        }
                        return;
                    }

                    const level = LevelManager.currentLevel();

                    // ---- 拖拽交互（目前用于加法/减法关卡）：按下先"拿起"水果，跟随手指移动，松手再判定 ----
                    if (level && level.interaction === 'drag') {
                        if (dragItem) return;
                        const item = ItemManager.itemAt(x, y);
                        if (!item) return;
                        item.dragging = true;
                        // 注意：拖动的这一组水果大小要和目标行完全一致，所以这里不做"拿起变大"的弹出效果，
                        // 避免拖动前后（以及放下后）出现大小不一致的视觉落差
                        if (!item.isGroup) item.scale = 1.15;
                        dragItem = item;
                        dragDX = x - item.x;
                        dragDY = y - item.y;
                        return;
                    }

                    if (ItemManager.moveLock) return;
                    const item = ItemManager.itemAt(x, y);
                    if (!item) return;

                    const targetContainer = ContainerManager.findAvailableContainer();
                    if (!targetContainer) return;

                    ItemManager.moveLock = true;
                    const onPlaced = () => {
                        ItemManager.moveLock = false;
                        ItemManager.maybeSpawnNextWave();
                        if (ContainerManager.isAllComplete()) {
                            const sz = getSize();
                            setTimeout(() => UI.showComplete(sz.cw, sz.ch), 260);
                        }
                    };

                    if (item.unitCount && item.unitCount > 1) {
                        // 水果束：一次点击占 N 个格子，N 个小水果各自飞进各自的格子
                        const result = ContainerManager.tryPlaceBundle(targetContainer, item);
                        if (!result) { ItemManager.moveLock = false; return; }
                        ItemManager.moveBundleToSlots(item, targetContainer, result.startIndex, result.subItems, onPlaced);
                    } else {
                        const placed = ContainerManager.tryPlace(targetContainer, item);
                        if (!placed) { ItemManager.moveLock = false; return; }
                        const slot = ContainerManager.slotPosition(targetContainer, targetContainer.items.length - 1);
                        ItemManager.moveToBoxSlot(item, targetContainer, slot, onPlaced);
                    }
                };

                const move = (e) => {
                    if (!dragItem) return;
                    e.preventDefault();
                    const { x, y } = toLocal(e);
                    dragItem.x = x - dragDX;
                    dragItem.y = y - dragDY;
                };

                const up = (e) => {
                    if (!dragItem) return;
                    const item = dragItem;
                    dragItem = null;
                    item.dragging = false;

                    const { cw, ch } = getSize();

                    // 松手时判定是否落在目标格子附近（留出比格子本身大一些的容错范围，方便小朋友拖放）
                    const targetContainer = ContainerManager.containers.find(c => c.items.length < c.capacity);
                    let validDrop = false;
                    if (targetContainer) {
                        // 大多数容器类型没有 dropZone，就用整个容器的范围判定；
                        // 减法关卡的 subtractionRow 专门指定了 dropZone（底部承接格子），
                        // 因为它的容器范围同时包含了顶部行（水果本来就在里面），不能直接用整个容器判定
                        const dz = targetContainer.dropZone;
                        const cx = targetContainer.x + (dz ? dz.dx : 0);
                        const cy = targetContainer.y + (dz ? dz.dy : 0);
                        const halfW = (dz ? dz.halfW : targetContainer.width / 2) + 30;
                        const halfH = (dz ? dz.halfH : targetContainer.height / 2) + 40;
                        if (Math.abs(item.x - cx) <= halfW && Math.abs(item.y - cy) <= halfH) {
                            validDrop = true;
                        }
                    }

                    if (validDrop) {
                        const onPlaced = () => {
                            ItemManager.maybeSpawnNextWave();
                            if (ContainerManager.isAllComplete()) {
                                setTimeout(() => UI.showComplete(cw, ch), 260);
                            }
                        };
                        if (item.isGroup) {
                            const result = ContainerManager.tryPlaceGroup(targetContainer, item);
                            if (result) {
                                ItemManager.moveGroupToSlots(item, targetContainer, result.startIndex, result.subItems, onPlaced);
                                return;
                            }
                        } else {
                            const placed = ContainerManager.tryPlace(targetContainer, item);
                            if (placed) {
                                const slot = ContainerManager.slotPosition(targetContainer, targetContainer.items.length - 1);
                                ItemManager.moveToBoxSlot(item, targetContainer, slot, onPlaced);
                                return;
                            }
                        }
                    }

                    // 没放对地方：飞回原来出现的位置
                    Animation.add(item, 'x', item.x, item.homeX, 260, null);
                    Animation.add(item, 'y', item.y, item.homeY, 260, null);
                    Animation.add(item, 'scale', item.scale, 1, 200, null);
                };

                canvas.addEventListener('mousedown', down);
                canvas.addEventListener('mousemove', move);
                window.addEventListener('mouseup', up);
                canvas.addEventListener('touchstart', down, { passive: false });
                canvas.addEventListener('touchmove', move, { passive: false });
                window.addEventListener('touchend', up);
            }
        };

        /* =========================================================
           GameLoop
        ========================================================= */
        const Game = {
            canvas: null,
            cw: 0, ch: 0, dpr: 1,
            lastTime: 0,
            mode: 'menu',

            init() {
                this.canvas = document.getElementById('gameCanvas');
                Renderer.init(this.canvas);
                this.resize();
                window.addEventListener('resize', () => this.resize());
                Input.bind(this.canvas, () => ({ cw: this.cw, ch: this.ch }));
                UI.layoutBackButton();
                UI.layoutMenu(this.cw, this.ch);
                requestAnimationFrame((t) => this.loop(t));
            },

            resize() {
                const maxW = 480;
                this.cw = Math.min(window.innerWidth, maxW);
                this.ch = window.innerHeight;
                this.dpr = window.devicePixelRatio || 1;
                this.canvas.style.width = this.cw + 'px';
                this.canvas.style.height = this.ch + 'px';
                this.canvas.width = this.cw * this.dpr;
                this.canvas.height = this.ch * this.dpr;
                Renderer.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
                UI.layoutMenu(this.cw, this.ch);
                if (this.mode === 'playing') LevelManager.reloadCurrent(this.cw, this.ch);
            },

            loop(time) {
                const dt = this.lastTime ? Math.min(time - this.lastTime, 50) : 16;
                this.lastTime = time;
                Animation.update(dt);
                Renderer.render(this.cw, this.ch);
                requestAnimationFrame((t) => this.loop(t));
            }
        };
