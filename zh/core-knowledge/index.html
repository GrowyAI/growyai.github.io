<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Core Knowledge 知识点速查</title>
<style>
  :root {
    --bg: #f7f8fa;
    --surface: #ffffff;
    --surface-2: #f1f4f8;
    --border: #dfe4ea;
    --text: #1f2933;
    --muted: #64748b;
    --accent: #2563eb;
    --accent-soft: #e8f0fe;
    --amber: #b45309;
    --amber-soft: #fef3c7;
    --green: #15803d;
    --green-soft: #dcfce7;
    --purple: #7e22ce;
    --purple-soft: #f3e8ff;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 15px;
    line-height: 1.55;
    -webkit-text-size-adjust: 100%;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 14px calc(10px + env(safe-area-inset-top));
  }
  .title-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 8px;
  }
  h1 { font-size: 17px; margin: 0; font-weight: 650; }
  h1 a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--accent); }
  .count { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .controls { display: grid; gap: 8px; }
  .search {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    background: var(--surface-2);
    color: var(--text);
  }
  .search:focus { outline: 2px solid var(--accent); background: var(--surface); }
  .grade-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .chip {
    flex: 0 0 auto;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 999px;
    padding: 6px 13px;
    font-size: 13px;
    cursor: pointer;
  }
  .chip.active { background: var(--accent); border-color: var(--accent); color: white; }
  .filter-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  select {
    flex: 1 1 130px;
    min-width: 0;
    max-width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
  }
  .toggle {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
    cursor: pointer;
  }
  .toggle input { accent-color: var(--accent); width: 16px; height: 16px; }
  main { padding: 12px 14px 80px; max-width: 900px; margin: 0 auto; }
  details.subject {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 10px;
    overflow: hidden;
  }
  details.subject > summary {
    padding: 12px 14px;
    font-weight: 620;
    font-size: 15px;
    cursor: pointer;
    background: var(--surface-2);
    list-style: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-left: 4px solid var(--subject-color, var(--accent));
  }
  .subject-core { color: var(--subject-color, var(--accent)); }
  details.subject > summary::-webkit-details-marker { display: none; }
  details.subject > summary::after { content: "+"; color: var(--muted); font-size: 18px; }
  details.subject[open] > summary::after { content: "−"; }
  .topic-group { border-top: 1px solid var(--border); }
  .topic-title {
    padding: 10px 14px;
    font-weight: 600;
    font-size: 14px;
    background: #fafbfc;
    color: var(--subject-color, #334155);
  }
  .subtopic-title {
    padding: 7px 14px;
    font-size: 13px;
    color: var(--subject-color, var(--accent));
    background: var(--accent-soft);
  }
  .section-title {
    list-style: none; margin: 8px 12px 2px; padding: 4px 8px;
    border-left: 3px solid var(--subject-color, var(--accent)); background: #f8fafc;
    font-size: 12px; font-weight: 600; color: #475569;
  }
  .section-zh { font-weight: 400; color: var(--muted); margin-left: 6px; }
  ul.items { list-style: none; margin: 0; padding: 0; }
  li.item {
    padding: 10px 14px;
    border-top: 1px solid #eef1f5;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .item-body { flex: 1; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-bottom: 4px; }
  .badge {
    font-size: 11px;
    padding: 1px 7px;
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--muted);
    white-space: nowrap;
  }
  .type-question { background: var(--amber-soft); color: var(--amber); }
  .type-work { background: var(--purple-soft); color: var(--purple); }
  .type-skill, .type-objective { background: var(--green-soft); color: var(--green); }
  .type-note { background: #f1f5f9; color: #475569; }
  .en { font-size: 15px; color: var(--text); line-height: 1.2; }
  .en a { color: var(--accent); text-decoration: none; border-bottom: 1px dashed var(--accent); }
  .en a:hover { background: var(--accent-soft); }
  .zh { font-size: 13px; color: var(--muted); line-height: 1.3; }
  .en + .zh { margin-top: 1px; }
  .en.dialogue-text, .zh.dialogue-text { white-space: pre-line; }
  .subject-cn { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 6px; }
  .subject-core { color: var(--subject-color, var(--accent)); }
  .meta { font-size: 11px; color: #94a3b8; margin-top: 4px; }
  .meta a { color: var(--accent); text-decoration: none; }
  .meta a:hover { text-decoration: underline; }
  .emoji-row {
    display: inline-flex;
    align-items: center;
    font-size: 15px;
    line-height: 1;
    letter-spacing: 1px;
    margin-left: 1px;
  }
  .details { margin: 5px 0 0; padding-left: 16px; color: var(--muted); font-size: 13px; }
  .details li { margin: 2px 0; }
  .item.collapsed .full-only { display: none; }
  .item:not(.collapsed) .preview-only { display: none; }
  .expand-btn {
    border: none; background: transparent; color: var(--accent);
    font-size: 12px; padding: 3px 0 0; cursor: pointer;
  }
  .fav {
    flex: 0 0 auto;
    border: none;
    background: transparent;
    color: #cbd5e1;
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    padding: 0 2px;
  }
  .fav.on { color: #f59e0b; }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 48px 16px;
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: var(--radius);
  }
  .more {
    display: block;
    width: 100%;
    margin-top: 12px;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--accent);
    font-size: 14px;
    cursor: pointer;
  }
  .footer-note { font-size: 12px; color: var(--muted); text-align: center; margin-top: 24px; }
  .footer-note a { color: var(--accent); }
  .header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .nav-btn {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 6px 11px; border: 1px solid var(--border); border-radius: 999px;
    background: var(--surface); color: var(--accent); font-size: 13px;
    text-decoration: none; cursor: pointer;
  }
  .topic-bar {
    margin-top: 10px; padding: 8px 10px; border-radius: 8px;
    background: var(--accent-soft); color: var(--accent); font-size: 12px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .topic-bar button { border: none; background: transparent; color: var(--accent); font-size: 12px; cursor: pointer; }
</style>
</head>
<body>
<header>
  <div class="title-row">
    <h1><a href="https://www.coreknowledge.org/free-resource/core-knowledge-sequence/" target="_blank" rel="noopener noreferrer">Core Knowledge</a> 知识点速查</h1>
    <div class="header-actions">
      <a class="nav-btn" href="../index.html">Growy 首页</a>
      <a class="nav-btn" href="roadmap.html">大纲</a>
      <a class="nav-btn" href="attribution.html">版权</a>
      <span class="count" id="count"></span>
    </div>
  </div>
  <div class="topic-bar" id="topicBar" hidden></div>
  <div class="controls">
    <input id="search" class="search" type="search" placeholder="搜索英文或中文知识点…" autocomplete="off">
    <div class="grade-row" id="grades"></div>
    <div class="filter-row">
      <select id="subject" aria-label="学科"></select>
      <select id="topic" aria-label="主题"></select>
      <select id="type" aria-label="类型"></select>
      <label class="toggle"><input type="checkbox" id="questionsOnly">只看问题</label>
      <label class="toggle"><input type="checkbox" id="favOnly">收藏</label>
      <label class="toggle"><input type="checkbox" id="langZh" checked>显示中文</label>
    </div>
  </div>
</header>
<main>
  <div id="content"></div>
  <button class="more" id="more" hidden>显示更多</button>
  <p class="footer-note" id="footer"></p>
</main>

<script src="data/knowledge-inline.js"></script>
<script src="data/topic-zh-inline.js"></script>
<script>
(function () {
  var DATA = window.KNOWLEDGE;
  var items = DATA.items;
  var favs = {};
  try { favs = JSON.parse(localStorage.getItem("ck-favs") || "{}"); } catch (e) { favs = {}; }
  var state = { grade: "K", subject: "", topic: "", subtopic: "", type: "", q: "", questionsOnly: false, favOnly: false, limit: 600 };
  var COLLAPSE_EN = 300;
  var COLLAPSE_ZH = 200;
  var PREVIEW_EN = 200;
  var PREVIEW_ZH = 100;
  var SUBJECT_ORDER = DATA.taxonomy.k8_subjects.concat(DATA.taxonomy.preschool_subjects);
  var GRADES = ["Preschool", "K", "1", "2", "3", "4", "5", "6", "7", "8"];
  var TYPE_ORDER = ["objective", "skill", "question", "work", "vocabulary", "dialogue", "note"];
  var SUBJECT_ZH = {
    "English Language Arts": "英语语言艺术",
    "Mathematics": "数学",
    "Science": "科学",
    "History and Geography": "历史与地理",
    "Visual Arts": "视觉艺术",
    "Music": "音乐",
    "Movement and Coordination": "动作与协调",
    "Social and Emotional Development": "社会情感发展",
    "Language and Literacy": "语言与读写",
    "History and Geography: Orientation in Time": "历史与地理：时间概念",
    "History and Geography: Orientation in Space": "历史与地理：空间概念",
    "Scientific Reasoning and the Physical World": "科学推理与物质世界",
    "Mathematical Reasoning and Number Sense": "数学推理与数感",
    "Emerging Literacy Skills in Reading and Writing": "读写萌芽技能",
    "Nursery Rhymes, Poems, Fingerplays and Songs": "童谣、诗歌、手指游戏与歌曲",
    "Storybook Reading and Storytelling": "绘本阅读与讲故事"
  };
  var CORE_SUBJECTS = {
    "English Language Arts": 1, "Mathematics": 1, "Science": 1, "History and Geography": 1,
    "Language and Literacy": 1, "Mathematical Reasoning and Number Sense": 1
  };
  var SUBJECT_COLORS = {
    "History and Geography": "#9A6B3F",
    "English Language Arts": "#4F6FA8",
    "Science": "#2F7D6E",
    "Mathematics": "#6B5CA5",
    "Visual Arts": "#B0556B",
    "Music": "#8A5AA8",
    "Language and Literacy": "#3F7E96",
    "Social and Emotional Development": "#B06A3B",
    "Movement and Coordination": "#5C8A4A"
  };
  function isCore(subject) { return !!CORE_SUBJECTS[subject]; }
  function subjectZh(subject) { return SUBJECT_ZH[subject] || ""; }
  function subjectColor(subject) {
    subject = subject || "";
    if (SUBJECT_COLORS[subject]) return SUBJECT_COLORS[subject];
    var keys = Object.keys(SUBJECT_COLORS);
    for (var k = 0; k < keys.length; k++) {
      if (subject.indexOf(keys[k]) === 0) return SUBJECT_COLORS[keys[k]];
    }
    return "#2563eb";
  }
  function topicZh(topic) { return (window.TOPIC_ZH && window.TOPIC_ZH[topic]) || ""; }
  function topicLabel(topic) {
    topic = topic || "(General)";
    var en = topic.length > 44 ? topic.slice(0, 41) + "…" : topic;
    var zh = topicZh(topic);
    return en + (zh ? " · " + zh : "");
  }

  function readParams() {
    var p = new URLSearchParams(location.search);
    var g = p.get("grade");
    if (g && GRADES.indexOf(g) >= 0) state.grade = g;
    state.subject = p.get("subject") || "";
    state.topic = p.get("topic") || "";
    state.subtopic = p.get("subtopic") || "";
    if (state.subject && !items.some(function (i) { return i.grade === state.grade && i.subject === state.subject; })) state.subject = "";
    if (state.topic && !items.some(function (i) {
      return i.grade === state.grade && i.subject === state.subject && i.topic === state.topic;
    })) state.topic = "";
    if (state.subtopic && !items.some(function (i) {
      return i.grade === state.grade && i.subject === state.subject &&
        i.topic === state.topic && i.subtopic === state.subtopic;
    })) state.subtopic = "";
  }

  function syncUrl() {
    try {
      var p = new URLSearchParams();
      p.set("grade", state.grade);
      if (state.subject) p.set("subject", state.subject);
      if (state.topic) p.set("topic", state.topic);
      if (state.subtopic) p.set("subtopic", state.subtopic);
      history.replaceState(null, "", location.href.split("?")[0] + "?" + p.toString());
    } catch (e) {}
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function gradeLabel(g) {
    if (g === "Preschool") return "学前";
    if (g === "K") return "K";
    return "G" + g;
  }

  function typeLabel(t) {
    return {
      objective: "知识点", skill: "技能", question: "问题", work: "作品",
      vocabulary: "词汇", dialogue: "对话", note: "提示"
    }[t] || t;
  }

  function renderTopicBar() {
    var bar = document.getElementById("topicBar");
    if (!state.topic) { bar.hidden = true; bar.innerHTML = ""; return; }
    var label = gradeLabel(state.grade) + " · " + (subjectZh(state.subject) || state.subject) +
      " · " + topicLabel(state.topic) + (state.subtopic ? " · " + state.subtopic : "");
    bar.hidden = false;
    bar.innerHTML = "<span>当前主题：<b>" + esc(label) + "</b></span><button id=\"clearTopic\">清除主题</button>";
    document.getElementById("clearTopic").addEventListener("click", function () {
      state.topic = "";
      state.subtopic = "";
      refreshFilters();
    });
  }

  function applyNav(nav) {
    nav = nav || {};
    if (nav.grade) state.grade = nav.grade;
    state.subject = nav.subject || "";
    state.topic = nav.topic || "";
    state.subtopic = nav.subtopic || "";
    state.type = "";
    state.q = "";
    state.questionsOnly = false;
    state.favOnly = false;
    state.limit = 600;
    document.getElementById("search").value = "";
    document.getElementById("questionsOnly").checked = false;
    document.getElementById("favOnly").checked = false;
    buildGradeChips();
    refreshFilters();
  }

  function buildGradeChips() {
    var box = document.getElementById("grades");
    box.innerHTML = GRADES.map(function (g) {
      return '<button class="chip' + (g === state.grade ? ' active' : '') + '" data-grade="' + g + '">' + gradeLabel(g) + "</button>";
    }).join("");
    Array.prototype.forEach.call(box.querySelectorAll(".chip"), function (chip) {
      chip.addEventListener("click", function () {
        applyNav({ grade: chip.dataset.grade });
      });
    });
  }

  function commonFiltered(skip) {
    skip = skip || {};
    var q = state.q.trim().toLowerCase();
    return items.filter(function (i) {
      if (!skip.grade && i.grade !== state.grade) return false;
      if (!skip.subject && state.subject && i.subject !== state.subject) return false;
      if (!skip.topic && state.topic && i.topic !== state.topic) return false;
      if (!skip.subtopic && state.subtopic && i.subtopic !== state.subtopic) return false;
      if (!skip.type && state.type && i.type !== state.type) return false;
      if (!skip.questionsOnly && state.questionsOnly && i.type !== "question" && i.type !== "dialogue") return false;
      if (!skip.favOnly && state.favOnly && !favs[i.id]) return false;
      if (!skip.q && q) {
        var hay = (i.en + " " + i.zh + " " + i.topic + " " + i.subtopic +
          " " + (i.section || "") + " " + (i.section_zh || "")).toLowerCase();
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    });
  }

  function filteredItems() { return commonFiltered({}); }

  function buildSubjects() {
    var counts = {};
    commonFiltered({subject: true, topic: true, subtopic: true}).forEach(function (i) {
      counts[i.subject] = (counts[i.subject] || 0) + 1;
    });
    if (state.subject && !counts[state.subject]) {
      state.subject = "";
      state.topic = "";
      state.subtopic = "";
    }
    var list = Object.keys(counts);
    list.sort(function (a, b) {
      var ac = isCore(a) ? 0 : 1, bc = isCore(b) ? 0 : 1;
      if (ac !== bc) return ac - bc;
      var ai = SUBJECT_ORDER.indexOf(a), bi = SUBJECT_ORDER.indexOf(b);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
    var sel = document.getElementById("subject");
    sel.innerHTML = '<option value="">全部学科 (' + list.length + ')</option>' + list.map(function (s) {
      var zh = subjectZh(s);
      var label = (isCore(s) ? "★ " : "") + esc(s) + (zh ? " · " + esc(zh) : "") + " (" + counts[s] + ")";
      return '<option value="' + esc(s) + '">' + label + "</option>";
    }).join("");
    sel.value = state.subject;
  }

  function buildTopics() {
    var counts = {};
    var order = [];
    commonFiltered({topic: true, subtopic: true}).forEach(function (i) {
      var t = i.topic || "(General)";
      if (!counts[t]) order.push(t);
      counts[t] = (counts[t] || 0) + 1;
    });
    if (state.topic && !counts[state.topic]) {
      state.topic = "";
      state.subtopic = "";
    }
    if (!state.topic) state.subtopic = "";
    var sel = document.getElementById("topic");
    sel.innerHTML = '<option value="">全部主题 (' + order.length + ')</option>' + order.map(function (t) {
      return '<option value="' + esc(t) + '">' + esc(topicLabel(t)) + " (" + counts[t] + ")</option>";
    }).join("");
    sel.value = state.topic;
  }

  function buildTypes() {
    var counts = {};
    commonFiltered({type: true}).forEach(function (i) {
      counts[i.type] = (counts[i.type] || 0) + 1;
    });
    if (state.type && !counts[state.type]) state.type = "";
    var sel = document.getElementById("type");
    var total = 0;
    Object.keys(counts).forEach(function (t) { total += counts[t]; });
    var html = '<option value="">全部类型 (' + total + ')</option>';
    TYPE_ORDER.forEach(function (t) {
      if (counts[t]) html += '<option value="' + t + '">' + esc(typeLabel(t)) + " (" + counts[t] + ")</option>";
    });
    Object.keys(counts).forEach(function (t) {
      if (TYPE_ORDER.indexOf(t) < 0) {
        html += '<option value="' + esc(t) + '">' + esc(typeLabel(t)) + " (" + counts[t] + ")</option>";
      }
    });
    sel.innerHTML = html;
    sel.value = state.type;
  }

  function previewText(text, n) {
    text = text || "";
    if (text.length <= n) return text;
    var cut = text.slice(0, n);
    var space = cut.lastIndexOf(" ");
    if (space > n * 0.6) cut = cut.slice(0, space);
    return cut + "…";
  }

  function itemHtml(i) {
    var showZh = document.getElementById("langZh").checked;
    var dialogClass = i.type === "dialogue" ? " dialogue-text" : "";
    var collapsed = (i.en || "").length > COLLAPSE_EN ||
      (showZh && (i.zh || "").length > COLLAPSE_ZH);
    var workLink = i.type === "work" && i.link;
    var linkStart = workLink
      ? '<a href="' + esc(i.link) + '" target="_blank" rel="noopener noreferrer" title="' + esc(i.work || "在 Google 中搜索") + '">'
      : "";
    var linkEnd = workLink ? "</a>" : "";
    var linkArrow = workLink ? " ↗" : "";
    var enHtml = '<div class="en' + dialogClass + (collapsed ? " preview-only" : "") + '">' +
      linkStart + esc(collapsed ? previewText(i.en, PREVIEW_EN) : i.en) + linkArrow + linkEnd + "</div>" +
      (collapsed ? '<div class="en' + dialogClass + ' full-only">' + linkStart + esc(i.en) + linkArrow + linkEnd + "</div>" : "");
    var zhHtml = "";
    if (showZh && i.zh) {
      zhHtml = '<div class="zh' + dialogClass + (collapsed ? " preview-only" : "") + '">' +
        esc(collapsed ? previewText(i.zh, PREVIEW_ZH) : i.zh) + "</div>" +
        (collapsed ? '<div class="zh' + dialogClass + ' full-only">' + esc(i.zh) + "</div>" : "");
    }
    var details = (i.details || []).map(function (d) { return "<li>" + esc(d) + "</li>"; }).join("");
    var meta = [];
    if (i.subtopic) meta.push(esc(i.subtopic));
    if (i.level) meta.push(esc(i.level));
    if (i.link && !workLink) {
      meta.push('<a href="' + esc(i.link) + '" target="_blank" rel="noopener noreferrer" title="' + esc(i.work || "相关资料") + '">相关资料 ↗</a>');
    }
    meta.push("p." + i.source.page);
    var emoji = (i.emojis || []).slice(0, 2).join("");
    var emojiHtml = emoji ? '<span class="emoji-row">' + emoji + "</span>" : "";
    var expandHtml = collapsed ? '<button class="expand-btn">展开全文</button>' : "";
    return '<li class="item' + (collapsed ? " collapsed" : "") + '" data-id="' + i.id + '">' +
      '<button class="fav' + (favs[i.id] ? " on" : "") + '" title="收藏">' + (favs[i.id] ? "★" : "☆") + "</button>" +
      '<div class="item-body">' +
      '<div class="badges"><span class="badge type-' + i.type + '">' + typeLabel(i.type) + "</span>" + emojiHtml +
      (i.subtopic ? '<span class="badge">' + esc(i.subtopic) + "</span>" : "") + "</div>" +
      enHtml + zhHtml +
      (details ? '<ul class="details' + (collapsed ? " full-only" : "") + '">' + details + "</ul>" : "") +
      expandHtml +
      '<div class="meta">' + meta.join(" · ") + "</div></div></li>";
  }

  function render() {
    var list = filteredItems();
    var shown = list.slice(0, state.limit);
    var box = document.getElementById("content");
    document.getElementById("count").textContent = list.length + " 条 / 共 " + items.length + " 条";
    var moreBtn = document.getElementById("more");
    moreBtn.hidden = list.length <= shown.length;
    if (!moreBtn.hidden) {
      moreBtn.textContent = "显示更多（还有 " + (list.length - shown.length) + " 条）";
    }
    if (!shown.length) {
      box.innerHTML = '<div class="empty">没有匹配的内容，换个筛选条件试试。</div>';
      return;
    }
    var bySubject = {};
    shown.forEach(function (i) {
      bySubject[i.subject] = bySubject[i.subject] || {};
      bySubject[i.subject][i.topic || "(General)"] = bySubject[i.subject][i.topic || "(General)"] || [];
      bySubject[i.subject][i.topic || "(General)"].push(i);
    });
    var html = "";
    Object.keys(bySubject).forEach(function (subject) {
      var topicHtml = "";
      Object.keys(bySubject[subject]).forEach(function (topic) {
        var arr = bySubject[subject][topic];
        var subGroups = {};
        arr.forEach(function (i) {
          var key = i.subtopic || "";
          subGroups[key] = subGroups[key] || [];
          subGroups[key].push(i);
        });
        var inner = "";
        Object.keys(subGroups).forEach(function (sub) {
          if (sub) inner += '<div class="subtopic-title">' + esc(sub) + "</div>";
          var groupHtml = "";
          var prevSection = "";
          subGroups[sub].forEach(function (entry) {
            var sec = entry.section || "";
            if (sec && sec !== prevSection) {
              var secZh = entry.section_zh
                ? '<span class="section-zh">' + esc(entry.section_zh) + "</span>" : "";
              groupHtml += '<li class="section-title">' + esc(sec) + secZh + "</li>";
            }
            prevSection = sec;
            groupHtml += itemHtml(entry);
          });
          inner += '<ul class="items">' + groupHtml + "</ul>";
        });
        topicHtml += '<div class="topic-group"><div class="topic-title">' + esc(topicLabel(topic)) +
          ' <span style="color:#94a3b8;font-weight:400">(' + arr.length + ")</span></div>" + inner + "</div>";
      });
      var zh = subjectZh(subject);
      var summaryLabel = (isCore(subject) ? '<span class="subject-core">★ </span>' : "") +
        esc(subject) + (zh ? '<span class="subject-cn">' + esc(zh) + "</span>" : "");
      html += '<details class="subject" open style="--subject-color:' + subjectColor(subject) + '"><summary>' +
        summaryLabel + "</summary>" + topicHtml + "</details>";
    });
    box.innerHTML = html;
    Array.prototype.forEach.call(box.querySelectorAll(".fav"), function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.closest("li").dataset.id;
        if (favs[id]) { delete favs[id]; btn.classList.remove("on"); btn.textContent = "☆"; }
        else { favs[id] = 1; btn.classList.add("on"); btn.textContent = "★"; }
        localStorage.setItem("ck-favs", JSON.stringify(favs));
        if (state.favOnly) refreshFilters();
      });
    });
    Array.prototype.forEach.call(box.querySelectorAll(".expand-btn"), function (btn) {
      btn.addEventListener("click", function () {
        var li = btn.closest("li.item");
        var isCollapsed = li.classList.toggle("collapsed");
        btn.textContent = isCollapsed ? "展开全文" : "收起";
      });
    });
    document.getElementById("footer").innerHTML =
      '来源：<a href="https://www.coreknowledge.org/free-resource/core-knowledge-sequence/" target="_blank" rel="noopener noreferrer">Core Knowledge Sequence 2023</a> · ' +
      DATA.meta.item_count + " 条知识点 · 具体名词/动作配 emoji，抽象条目不配 · 具体作品配外部搜索链接 · 收藏保存在本机浏览器 · " +
      '<a href="attribution.html">版权与署名</a> · 原版 PDF：' +
      '<a href="https://www.coreknowledge.org/wp-content/uploads/2023/03/CK_Sequence2023_PreSchool_W2.pdf" target="_blank" rel="noopener noreferrer">Preschool</a> / ' +
      '<a href="https://www.coreknowledge.org/wp-content/uploads/2023/03/CK_Sequence2023_GK8_W3.pdf" target="_blank" rel="noopener noreferrer">K–8</a>';
  }

  function refreshFilters() {
    state.limit = 600;
    buildSubjects();
    buildTopics();
    buildTypes();
    render();
    renderTopicBar();
    syncUrl();
  }

  var timer;
  document.getElementById("search").addEventListener("input", function (e) {
    clearTimeout(timer);
    timer = setTimeout(function () { state.q = e.target.value; refreshFilters(); }, 180);
  });
  document.getElementById("subject").addEventListener("change", function (e) {
    state.subject = e.target.value;
    state.topic = "";
    state.subtopic = "";
    refreshFilters();
  });
  document.getElementById("topic").addEventListener("change", function (e) {
    state.topic = e.target.value;
    state.subtopic = "";
    refreshFilters();
  });
  document.getElementById("type").addEventListener("change", function (e) {
    state.type = e.target.value; refreshFilters();
  });
  document.getElementById("questionsOnly").addEventListener("change", function (e) {
    state.questionsOnly = e.target.checked; refreshFilters();
  });
  document.getElementById("favOnly").addEventListener("change", function (e) {
    state.favOnly = e.target.checked; refreshFilters();
  });
  document.getElementById("langZh").addEventListener("change", render);
  document.getElementById("more").addEventListener("click", function () {
    state.limit += 600; render();
  });

  readParams();
  buildGradeChips();
  refreshFilters();
})();
</script>
</body>
</html>
